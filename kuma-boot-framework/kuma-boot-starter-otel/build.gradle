plugins {
    id 'java-library'
}

description = 'KumaFramework 分布式链路追踪模块（Micrometer Tracing + OpenTelemetry SDK + OTLP，对接 Tempo / Jaeger / Zipkin）'

dependencies {
    api platform(projectLibs.spring.boot.bom)
    api project(':kuma-boot-framework:kuma-boot-starter-core')

    // Boot 4 将 OTel SDK、Tracing 自动装配及 OTLP 导出拆分到了独立模块，统一由官方 starter 引入。
    api projectLibs.spring.boot.starter.opentelemetry
    api projectLibs.spring.boot.starter.actuator

    // 向业务模块暴露 Tracer / Span API，版本由 Boot BOM 对齐。
    api projectLibs.micrometer.tracing.api

    compileOnly projectLibs.lombok
    annotationProcessor projectLibs.lombok

    testImplementation projectLibs.spring.boot.starter.test
    testImplementation 'io.opentelemetry:opentelemetry-sdk'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
