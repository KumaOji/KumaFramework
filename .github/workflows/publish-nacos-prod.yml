name: Publish Nacos Prod Configs

on:
  push:
    branches: [master]
    paths:
      - '.nacos-tmp/base/kuma-shared-prod.yaml'
      - '.nacos-tmp/base/kuma-cloud-uaa-prod.yaml'
      - '.nacos-tmp/base/kuma-cloud-gateway-prod.yaml'
      - 'scripts/publish-nacos-prod.sh'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy configs and script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: scripts/publish-nacos-prod.sh,.nacos-tmp/base/kuma-shared-prod.yaml,.nacos-tmp/base/kuma-cloud-uaa-prod.yaml,.nacos-tmp/base/kuma-cloud-gateway-prod.yaml
          target: /tmp/nacos-config/
          strip_components: 0

      - name: Publish prod configs to blog-nacos
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: NACOS_PASSWORD
          script: |
            chmod +x /tmp/nacos-config/scripts/publish-nacos-prod.sh
            CONFIG_ROOT=/tmp/nacos-config NACOS_PASSWORD="${NACOS_PASSWORD:-}" \
              /tmp/nacos-config/scripts/publish-nacos-prod.sh
        env:
          NACOS_PASSWORD: ${{ secrets.NACOS_PASSWORD }}
