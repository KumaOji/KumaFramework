name: Apply K8s Configs

on:
  push:
    branches: [master]
    paths:
      - 'k8s/**'
      - 'scripts/check-observability.py'
      - 'scripts/apply-k8s-resource.py'
      - '.github/workflows/apply-k8s.yml'
  workflow_dispatch:

concurrency:
  group: apply-k8s-configs
  cancel-in-progress: false

env:
  REGISTRY: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Mirror observability images to ACR
        shell: bash
        run: |
          set -euo pipefail
          while read -r upstream repository version; do
            target="${REGISTRY}/kumaoji/observability-${repository}:${version}"
            if docker manifest inspect "$target" >/dev/null 2>&1; then
              echo "Image already mirrored: $target"
              continue
            fi
            docker pull --platform linux/amd64 "${upstream}:${version}"
            docker tag "${upstream}:${version}" "$target"
            docker push "$target"
          done <<'IMAGES'
          docker.io/library/elasticsearch elasticsearch 8.17.3
          docker.io/apache/skywalking-oap-server skywalking-oap 10.2.0
          docker.io/apache/skywalking-ui skywalking-ui 10.2.0
          docker.io/otel/opentelemetry-collector-contrib otel-collector 0.123.0
          docker.io/grafana/loki loki 3.7.8
          docker.io/grafana/grafana grafana 13.2.3
          docker.io/prom/prometheus prometheus v3.15.0
          docker.io/prom/alertmanager alertmanager v0.34.1
          IMAGES

      - name: Prepare k8s dirs on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          script: mkdir -p /data/k8s/base /data/k8s/blog /data/k8s/scripts /data/k8s/server/observability /data/k8s/server/monitoring /data/k8s/monitoring

      - name: Copy base k8s files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: k8s/base/*
          target: /data/k8s/base/
          strip_components: 2

      - name: Copy blog k8s files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: k8s/blog/*
          target: /data/k8s/blog/
          strip_components: 2

      - name: Copy deployment helpers to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: scripts/check-observability.py,scripts/apply-k8s-resource.py,scripts/prepare-monitoring-server.sh,scripts/check-monitoring-server.py,scripts/expose-monitoring-server.sh
          target: /data/k8s/scripts/
          strip_components: 1

      - name: Copy server observability overlay
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: k8s/server/observability/*
          target: /data/k8s/server/observability/
          strip_components: 3

      - name: Copy common monitoring resources
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: k8s/monitoring/*
          target: /data/k8s/monitoring/
          strip_components: 2

      - name: Copy server monitoring overlay
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: k8s/server/monitoring/*
          target: /data/k8s/server/monitoring/
          strip_components: 3

      - name: Apply k8s configs and verify observability
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: REGISTRY,REGISTRY_USER,REGISTRY_PASSWORD
          script: |
            set -eu
            bash /data/k8s/scripts/prepare-monitoring-server.sh
            registry_manifest="$(mktemp)"
            trap 'rm -f "$registry_manifest"' EXIT
            kubectl create secret docker-registry observability-registry -n base \
              --docker-server="$REGISTRY" --docker-username="$REGISTRY_USER" \
              --docker-password="$REGISTRY_PASSWORD" --dry-run=client -o yaml > "$registry_manifest"
            kubectl apply -f "$registry_manifest"
            rm -f "$registry_manifest"
            trap - EXIT
            for f in /data/k8s/base/*.yaml /data/k8s/blog/*.yaml; do
              b=$(basename "$f")
              case "$b" in
                *secret.example.yaml|*secret.yaml) continue ;;
                kustomization.yaml|observability.yaml) continue ;;
                blog-background.yaml|blog-fronted.yaml|gateway.yaml|uaa.yaml|lab.yaml) continue ;;
                # Preserve provisioner-owned immutable fields of the bound MySQL PVC.
                mysql.yaml)
                  python3 /data/k8s/scripts/apply-k8s-resource.py "$f"
                  continue
                  ;;
              esac
              kubectl apply -f "$f"
            done
            kubectl apply -k /data/k8s/server/observability
            kubectl apply -k /data/k8s/server/monitoring
            kubectl rollout status deployment/nacos -n base --timeout=300s || true
            kubectl rollout status statefulset/skywalking-storage -n base --timeout=600s
            for deployment in skywalking-oap skywalking-ui otel-collector; do
              kubectl rollout status "deployment/${deployment}" -n base --timeout=300s
            done
            python3 /data/k8s/scripts/check-observability.py
            for component in loki grafana prometheus alertmanager; do
              kubectl rollout status "statefulset/${component}" -n base --timeout=600s
            done
            bash /data/k8s/scripts/expose-monitoring-server.sh
            python3 /data/k8s/scripts/check-monitoring-server.py --infrastructure-only

      - name: Report observability diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            kubectl get pods -n base -l 'app in (skywalking-storage,skywalking-oap,skywalking-ui,otel-collector)' -o wide
            kubectl get pvc -n base data-skywalking-storage-0
            kubectl get events -n base --sort-by=.lastTimestamp | tail -40
            kubectl logs -n base statefulset/skywalking-storage --tail=40 || true
            for deployment in skywalking-oap skywalking-ui otel-collector; do
              kubectl logs -n base "deployment/${deployment}" --all-containers --tail=40 || true
            done
