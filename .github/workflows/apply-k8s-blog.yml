name: Apply Blog K8s Configs

on:
  push:
    branches: [master]
    paths:
      - 'kuma-project/kuma-project-blog/k8s/**'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare k8s dir on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          script: mkdir -p /data/k8s/base

      - name: Copy k8s files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          source: kuma-project/kuma-project-blog/k8s/*
          target: /data/k8s/base/
          strip_components: 3

      - name: Apply k8s configs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BLOG_SERVER_HOST }}
          username: ${{ secrets.BLOG_SERVER_USER }}
          key: ${{ secrets.BLOG_SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            for f in /data/k8s/base/*.yaml; do
              b=$(basename "$f")
              case "$b" in
                *secret.example.yaml|*secret.yaml) continue ;;
                blog-background.yaml|blog-fronted.yaml|gateway.yaml|uaa.yaml) continue ;;
              esac
              kubectl apply -f "$f"
            done
            kubectl rollout status deployment/nacos -n base --timeout=300s || true
