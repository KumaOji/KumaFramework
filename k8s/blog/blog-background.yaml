# Blog 后端部署在 blog 命名空间，连接 base 命名空间基础设施。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-background
  namespace: blog
spec:
  replicas: 1
  # 镜像拉取也计入部署进度期限，与 CI 的 rollout 等待时间保持一致。
  progressDeadlineSeconds: 900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blog-background
  template:
    metadata:
      labels:
        app: blog-background
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: blog-background
          # 注意：image 是占位符，CI 部署时先 apply 本清单再 kubectl set image 覆盖为真实镜像。
          # 手动 apply 本文件后必须立即 set image，否则 Pod 会因拉取 placeholder 失败而 ImagePullBackOff
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/blog:placeholder
          ports:
            - containerPort: 9000
            - containerPort: 19001
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,observability
            - name: KUMA_CONFIG_PROFILE
              value: "prod"
            - name: LOGGING_CONFIG
              value: "classpath:logback-observability.xml"
            - name: MANAGEMENT_SERVER_PORT
              value: "19001"
            - name: MANAGEMENT_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "never"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://otel-collector.base:4318/v1/traces"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_METRICS_TAGS_ENVIRONMENT
              value: "server"
            - name: KUMA_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: GATEWAY_ENVIRONMENT
              value: "server"
            - name: GATEWAY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: KUMA_BOOT_WEB_REQUEST_ENABLED
              value: "false"
            - name: KUMA_BOOT_LOGGER_LOGGING_FILES_ENABLED
              value: "false"
            - name: ATLAS_LOG_ENABLED
              value: "false"
            - name: LOGGING_ACCESS_ENABLED
              value: "false"
            - name: KUMA_BOOT_MONITOR_ENABLED
              value: "false"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos.base:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: nacos-password
            - name: SPRING_CONFIG_IMPORT
              value: "optional:nacos:kuma-shared-prod.yaml?group=DEFAULT_GROUP&refreshEnabled=true,optional:nacos:kuma-cloud-blog-prod.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: admin-initial-password
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql.base:3306/base?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: mysql-root-password
            - name: REDIS_HOST
              value: redis.base
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DATABASE
              value: "0"
            - name: BLOG_OAUTH2_CLIENT_ID
              value: blog
            - name: BLOG_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: blog-oauth2-client-secret
            - name: BLOG_OAUTH2_AUTHORIZATION_URI
              value: "https://uaa.kumacloud.top/oauth2/authorize"
            - name: BLOG_OAUTH2_TOKEN_URI
              value: "http://uaa.base:33336/oauth2/token"
            - name: BLOG_OAUTH2_JWK_SET_URI
              value: "http://uaa.base:33336/oauth2/jwks"
            - name: BLOG_OAUTH2_USER_INFO_URI
              value: "http://uaa.base:33336/userinfo"
            - name: BLOG_OAUTH2_ISSUER_URI
              value: "https://uaa.kumacloud.top"
            - name: BLOG_OAUTH2_AUDIENCE
              value: blog
            - name: BLOG_OAUTH2_UAA_URI
              value: "http://uaa.base:33336"
            - name: BLOG_LOGIN_SUCCESS_URL
              value: "https://blog.kumacloud.top/"
            # 外部 LLM API（OpenAI / 兼容接口）
            - name: AI_CHAT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-base-url
            - name: AI_CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-api-key
            - name: AI_CHAT_MODEL
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-model
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 19001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 19001
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: music
              mountPath: /data/music
            - name: logs
              mountPath: /data/blog/logs
      volumes:
        - name: music
          hostPath:
            path: /data/blog/background/music
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/blog/background/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: blog-background
  namespace: blog
spec:
  selector:
    app: blog-background
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: management
      port: 19001
      targetPort: 19001
