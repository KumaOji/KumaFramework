apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsshub
  namespace: life-deals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: life-deals-rsshub
  template:
    metadata:
      labels:
        app: life-deals-rsshub
    spec:
      automountServiceAccountToken: false
      containers:
      - name: rsshub
        image: ghcr.io/diygod/rsshub@sha256:b222cbcb45c10e1dc6dfa2e03968e644bbb36dfe51b0bae24310df40b0f2f189
        env:
        - name: TZ
          value: Asia/Hong_Kong
        - name: NODE_ENV
          value: production
        - name: CACHE_TYPE
          value: redis
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: CACHE_EXPIRE
          value: '900'
        - name: REQUEST_TIMEOUT
          value: '15000'
        - name: REQUEST_RETRY
          value: '1'
        - name: DISALLOW_ROBOT
          value: 'true'
        envFrom:
        - secretRef:
            name: rsshub-secrets
            optional: true
        ports:
        - containerPort: 1200
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: 1200
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 1200
        livenessProbe:
          httpGet:
            path: /healthz
            port: 1200
          periodSeconds: 30
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rsshub
  namespace: life-deals
spec:
  type: LoadBalancer
  selector:
    app: life-deals-rsshub
  ports:
  - port: 1200
    targetPort: 1200
