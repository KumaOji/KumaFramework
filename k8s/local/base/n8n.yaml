# WSL local configuration; runtime metadata removed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: base-infrastructure
  name: n8n
  namespace: base
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  serviceName: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: base-infrastructure
    spec:
      containers:
      - env:
        - name: N8N_DEFAULT_LOCALE
          value: zh-CN
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: 'false'
        - name: NODES_EXCLUDE
          value: '["n8n-nodes-base.localFileTrigger"]'
        - name: N8N_AI_PROVIDER
          value: deepseek
        - name: DEEPSEEK_MODEL
          value: deepseek-chat
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              key: deepseek-api-key
              name: n8n-ai-auth
              optional: true
        - name: DEEPSEEK_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: deepseek-api-key
              name: n8n-ai-auth
              optional: true
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              key: openrouter-api-key
              name: n8n-ai-auth
              optional: true
        - name: DASHSCOPE_API_KEY
          valueFrom:
            secretKeyRef:
              key: dashscope-api-key
              name: n8n-ai-auth
              optional: true
        - name: N8N_GITHUB_HTTP_PROXY
          value: http://172.17.160.1:7897
        - name: N8N_GITHUB_REPORT_DIR
          value: /home/node/github-reports
        - name: N8N_RESTRICT_FILE_ACCESS_TO
          value: /home/node/github-reports
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgresql.base.svc.cluster.local
        - name: DB_POSTGRESDB_PORT
          value: '5432'
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgresql-auth
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgresql-auth
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: encryption-key
              name: n8n-auth
        - name: N8N_HOST
          value: 0.0.0.0
        - name: N8N_PORT
          value: '5678'
        - name: N8N_PROTOCOL
          value: http
        - name: WEBHOOK_URL
          value: http://127.0.0.1:5678/
        - name: N8N_SECURE_COOKIE
          value: 'false'
        - name: N8N_BASIC_AUTH_ACTIVE
          value: 'true'
        - name: N8N_BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              key: basic-auth-user
              name: n8n-auth
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              key: basic-auth-password
              name: n8n-auth
        - name: GENERIC_TIMEZONE
          value: Asia/Hong_Kong
        - name: TZ
          value: Asia/Hong_Kong
        - name: N8N_SSH_HOST
          value: 117.72.13.197
        - name: N8N_SSH_PORT
          value: '22'
        - name: N8N_SSH_USER
          value: root
        - name: N8N_SSH_KEY_PATH
          value: /home/node/.ssh/kumakey.pem
        - name: N8N_WSL_SSH_HOST
          value: 172.17.0.1
        - name: N8N_WSL_SSH_PORT
          value: '2222'
        - name: N8N_WSL_USER
          value: root
        image: blowsnow/n8n-chinese:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: n8n
        ports:
        - containerPort: 5678
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: data
        - mountPath: /home/node/.ssh/kumakey.pem
          name: ssh-key
          readOnly: true
          subPath: kumakey.pem
        - mountPath: /mnt/yuna
          name: yuna-src
          readOnly: true
        - mountPath: /home/node/github-reports
          name: github-reports
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 60
      volumes:
      - name: ssh-key
        secret:
          defaultMode: 256
          optional: true
          secretName: n8n-ssh-key
      - hostPath:
          path: /mnt/d/PyCharm_project/Yuna
          type: DirectoryOrCreate
        name: yuna-src
      - hostPath:
          path: /mnt/c/Users/Kuma/Desktop/github汇总
          type: DirectoryOrCreate
        name: github-reports
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/part-of: base-infrastructure
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
      volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: base-infrastructure
  name: n8n
  namespace: base
spec:
  ports:
  - name: http
    port: 5678
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: n8n
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: base-infrastructure
  name: n8n-external
  namespace: base
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 32571
    port: 5678
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: n8n
  sessionAffinity: None
  type: LoadBalancer
