# WSL local configuration; runtime metadata removed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: base-infrastructure
  name: qdrant
  namespace: base
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  serviceName: qdrant-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: base-infrastructure
    spec:
      containers:
      - env:
        - name: QDRANT__SERVICE__API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: qdrant-auth
        image: qdrant/qdrant:v1.19.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: qdrant
        ports:
        - containerPort: 6333
          name: http
          protocol: TCP
        - containerPort: 6334
          name: grpc
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz
            port: http
            scheme: HTTP
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
        - mountPath: /qdrant/snapshots
          name: snapshots
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: snapshots
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: base-infrastructure
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: local-path
      volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: base-infrastructure
  name: qdrant
  namespace: base
spec:
  ports:
  - name: http
    port: 6333
    protocol: TCP
    targetPort: http
  - name: grpc
    port: 6334
    protocol: TCP
    targetPort: grpc
  selector:
    app.kubernetes.io/name: qdrant
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: base-infrastructure
  name: qdrant-external
  namespace: base
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 31377
    port: 6333
    protocol: TCP
    targetPort: http
  - name: grpc
    nodePort: 31457
    port: 6334
    protocol: TCP
    targetPort: grpc
  selector:
    app.kubernetes.io/name: qdrant
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: base-infrastructure
  name: qdrant-headless
  namespace: base
spec:
  ports:
  - name: http
    port: 6333
    protocol: TCP
    targetPort: http
  - name: grpc
    port: 6334
    protocol: TCP
    targetPort: grpc
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: qdrant
  sessionAffinity: None
  type: ClusterIP
  clusterIP: None
