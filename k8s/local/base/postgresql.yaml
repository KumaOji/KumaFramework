# WSL local configuration; runtime metadata removed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: base-infrastructure
  name: postgresql
  namespace: base
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  serviceName: postgresql-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: base-infrastructure
    spec:
      containers:
      - args:
        - -c
        - max_connections=200
        - -c
        - shared_buffers=256MB
        - -c
        - timezone=Asia/Hong_Kong
        env:
        - name: POSTGRES_USER_FILE
          value: /run/secrets/postgresql/username
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/postgresql/password
        - name: POSTGRES_DB_FILE
          value: /run/secrets/postgresql/database
        - name: TZ
          value: Asia/Hong_Kong
        image: postgres:18.4-bookworm
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pg_isready
            - --host=127.0.0.1
            - --username=postgres
            - --dbname=base
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - --host=127.0.0.1
            - --username=postgres
            - --dbname=base
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - pg_isready
            - --host=127.0.0.1
            - --username=postgres
            - --dbname=base
          failureThreshold: 60
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: data
        - mountPath: /run/secrets/postgresql
          name: auth
          readOnly: true
        - mountPath: /dev/shm
          name: dshm
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 60
      volumes:
      - name: auth
        secret:
          defaultMode: 288
          secretName: postgresql-auth
      - emptyDir:
          medium: Memory
          sizeLimit: 256Mi
        name: dshm
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: base-infrastructure
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: local-path
      volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: base-infrastructure
  name: postgresql
  namespace: base
spec:
  ports:
  - name: postgresql
    port: 5432
    protocol: TCP
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: postgresql
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: base-infrastructure
  name: postgresql-external
  namespace: base
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: postgresql
    nodePort: 32066
    port: 5432
    protocol: TCP
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: postgresql
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: base-infrastructure
  name: postgresql-headless
  namespace: base
spec:
  ports:
  - name: postgresql
    port: 5432
    protocol: TCP
    targetPort: postgresql
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgresql
  sessionAffinity: None
  type: ClusterIP
  clusterIP: None
