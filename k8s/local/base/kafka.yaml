# WSL local configuration; runtime metadata removed.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: base-infrastructure
  name: kafka-external
  namespace: base
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: tcp-clients
    nodePort: 31804
    port: 9092
    protocol: TCP
    targetPort: 9094
  selector:
    strimzi.io/cluster: kafka
    strimzi.io/kind: Kafka
    strimzi.io/name: kafka-kafka
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: base
spec:
  entityOperator:
    topicOperator:
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
    userOperator:
      resources:
        limits:
          cpu: 250m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
  kafka:
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
    listeners:
    - name: plain
      port: 9092
      tls: false
      type: internal
    - configuration:
        brokers:
        - advertisedHost: 172.23.89.45
          advertisedPort: 9092
          broker: 0
      name: external
      port: 9094
      tls: false
      type: nodeport
    version: 4.3.0
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  labels:
    strimzi.io/cluster: kafka
  name: pool
  namespace: base
spec:
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  replicas: 1
  resources:
    limits:
      cpu: '1'
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 768Mi
  roles:
  - controller
  - broker
  storage:
    class: local-path
    deleteClaim: false
    size: 10Gi
    type: persistent-claim
