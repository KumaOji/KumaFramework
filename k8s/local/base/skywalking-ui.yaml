apiVersion: v1
kind: Service
metadata:
  name: skywalking-ui
  namespace: base
spec:
  selector:
    app: skywalking-ui
  ports:
  - name: http
    port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-ui
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-ui
  template:
    metadata:
      labels:
        app: skywalking-ui
    spec:
      containers:
      - name: ui
        image: docker.io/apache/skywalking-ui:10.2.0
        env:
        - name: SW_OAP_ADDRESS
          value: http://skywalking-oap:12800
        - name: SW_ZIPKIN_ADDRESS
          value: http://skywalking-oap:9412
        - name: JAVA_OPTS
          value: -Xms128m -Xmx256m
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: http
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
