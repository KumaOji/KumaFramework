apiVersion: v1
kind: Service
metadata:
  name: skywalking-storage
  namespace: base
spec:
  selector:
    app: skywalking-storage
  ports:
  - name: http
    port: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skywalking-storage
  namespace: base
spec:
  serviceName: skywalking-storage
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-storage
  template:
    metadata:
      labels:
        app: skywalking-storage
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: elasticsearch
        image: docker.io/library/elasticsearch:8.17.3
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: node.store.allow_mmap
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        ports:
        - name: http
          containerPort: 9200
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /_cluster/health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=1s
            port: http
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
