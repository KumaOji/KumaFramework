# WSL local configuration; runtime metadata removed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: base-infrastructure
  name: redis
  namespace: base
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  serviceName: redis-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: base-infrastructure
    spec:
      containers:
      - command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        image: redis:8.2.7-bookworm
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$(cat /run/secrets/redis/password)" redis-cli ping
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$(cat /run/secrets/redis/password)" redis-cli ping
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$(cat /run/secrets/redis/password)" redis-cli ping
          failureThreshold: 60
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /usr/local/etc/redis/redis.conf
          name: config
          readOnly: true
          subPath: redis.conf
        - mountPath: /run/secrets/redis
          name: auth
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: redis-config
        name: config
      - name: auth
        secret:
          defaultMode: 288
          secretName: redis-auth
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: base-infrastructure
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
      volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: base-infrastructure
  name: redis
  namespace: base
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app.kubernetes.io/name: redis
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: base-infrastructure
  name: redis-external
  namespace: base
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: redis
    nodePort: 31281
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app.kubernetes.io/name: redis
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: base-infrastructure
  name: redis-headless
  namespace: base
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis
  sessionAffinity: None
  type: ClusterIP
  clusterIP: None
---
apiVersion: v1
data:
  redis.conf: 'bind 0.0.0.0

    protected-mode yes

    port 6379

    dir /data


    aclfile /run/secrets/redis/users.acl


    appendonly yes

    appendfsync everysec

    save 900 1

    save 300 10

    save 60 10000


    maxmemory 768mb

    maxmemory-policy noeviction'
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: base-infrastructure
  name: redis-config
  namespace: base
