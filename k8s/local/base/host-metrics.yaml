    ready: true
kind: EndpointSlice
metadata:
  labels:
    endpointslice.kubernetes.io/managed-by: kuma-wsl
    kubernetes.io/service-name: reference-local
  name: reference-local
  namespace: base
ports:
- name: metrics
  port: 19092
  protocol: TCP
