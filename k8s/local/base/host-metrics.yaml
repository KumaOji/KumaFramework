# WSL local configuration; runtime metadata removed.
apiVersion: v1
kind: Service
metadata:
  name: reference-local
  namespace: base
spec:
  ports:
  - name: metrics
    port: 19092
    protocol: TCP
    targetPort: 19092
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: uaa-local
  namespace: base
spec:
