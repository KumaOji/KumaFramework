apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dashboard
  namespace: base
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: kuma-gateway
        orgId: 1
        folder: Kuma
        type: file
        disableDeletion: false
        updateIntervalSeconds: 15
        options:
          path: /var/lib/grafana/dashboards
  gateway.json: |
    {
      "uid": "kuma-gateway",
      "title": "11 · Prometheus · Gateway 网关",
      "tags": [
        "kuma",
        "gateway"
      ],
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "请求速率（次/秒）",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"kuma-cloud-gateway\"}[5m]))",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "5xx 错误率",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"kuma-cloud-gateway\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application=\"kuma-cloud-gateway\"}[5m])),0.001)",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "请求 P95 耗时",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{application=\"kuma-cloud-gateway\"}[5m])))",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "JVM 已用内存",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(jvm_memory_used_bytes{application=\"kuma-cloud-gateway\"})",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "路由请求速率",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(routeId)(rate(spring_cloud_gateway_requests_seconds_count{application=\"kuma-cloud-gateway\"}[5m]))",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "目标可用状态",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"gateway\"}",
              "legendFormat": "{{routeId}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Gateway 日志",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service_name=\"kuma-cloud-gateway\"}",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ],
      "links": [
        {
          "type": "link",
          "title": "00 · 可观测性总览",
          "url": "/d/kuma-overview",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "10 · Prometheus · 服务指标",
          "url": "/d/kuma-services",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "11 · Prometheus · Gateway 网关",
          "url": "/d/kuma-gateway",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "12 · Prometheus · 监控组件",
          "url": "/d/kuma-monitoring",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "20 · Loki · 服务日志",
          "url": "/d/kuma-logs",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "30 · SkyWalking · 调用链",
          "url": "/d/kuma-traces",
          "icon": "dashboard",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false
        }
      ]
    }
