              "mode": "multi"
            }
          }
        },
        {
          "id": 19,
          "title": "订单操作审计（展开 message 查看操作人、scope、结果与耗时）",
          "type": "logs",
          "description": "创建记录的 result 包含订单 ID，确认记录 bizId 为 scope:ID。失败记录 success=false。日志 traceId 可跳转至 SkyWalking；日志按环境筛选，涵盖所有实例。",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 72,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service_name=\"kuma-reference\",environment=~\"$environment\"} | json | logger_name=\"com.kuma.boot.auditlog.AUDIT\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "id": 20,
          "title": "应用日志与链路关联",
          "type": "logs",
          "description": "展开 traceId 字段跳转 SkyWalking。Agent 自身链路使用独立 ID；这里关联 OpenTelemetry 导出的链路。",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 82,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{service_name=\"kuma-reference\",environment=~\"$environment\"} | json",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
