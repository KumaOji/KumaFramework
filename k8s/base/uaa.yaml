apiVersion: apps/v1
kind: Deployment
metadata:
  name: uaa
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uaa
  template:
    metadata:
      labels:
        app: uaa
    spec:
      containers:
        - name: uaa
          # 注意：image 是占位符，CI 部署时先 apply 本清单再 kubectl set image 覆盖为真实镜像。
          # 手动 apply 本文件后必须立即 set image，否则 Pod 会因拉取 placeholder 失败而 ImagePullBackOff
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/uaa:placeholder
          ports:
            - containerPort: 33336
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: UAA_JWK_PRIVATE_KEY
              value: /app/data/uaa-jwt-rsa-private.pem
            # 私钥内容从 Secret 下发，优先于文件；Secret 缺失时回退到 hostPath 文件
            - name: UAA_JWK_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: uaa-jwk-private-key
                  optional: true
            - name: KUMA_UAA_ISSUER
              value: "https://uaa.kumacloud.top"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: nacos-password
            - name: UAA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: uaa-admin-password
            - name: BLOG_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: blog-oauth2-client-secret
            - name: GATEWAY_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: gateway-oauth2-client-secret
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: mysql-root-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: redis-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 33336
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 33336
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: uaa-data
              mountPath: /app/data
            - name: logs
              mountPath: /data/uaa/logs
      volumes:
        - name: uaa-data
          hostPath:
            path: /data/blog/uaa/data
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/blog/uaa/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: uaa
  namespace: base
spec:
  type: ClusterIP
  selector:
    app: uaa
  ports:
    - port: 33336
      targetPort: 33336
