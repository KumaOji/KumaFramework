apiVersion: apps/v1
kind: Deployment
metadata:
  name: uaa
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uaa
  template:
    metadata:
      labels:
        app: uaa
    spec:
      containers:
        - name: uaa
          # 注意：image 是占位符，CI 部署时先 apply 本清单再 kubectl set image 覆盖为真实镜像。
          # 手动 apply 本文件后必须立即 set image，否则 Pod 会因拉取 placeholder 失败而 ImagePullBackOff
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/uaa:placeholder
          ports:
            - containerPort: 33336
            - containerPort: 19002
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,observability
            - name: KUMA_CONFIG_PROFILE
              value: "prod"
            - name: LOGGING_CONFIG
              value: "classpath:logback-observability.xml"
            - name: MANAGEMENT_SERVER_PORT
              value: "19002"
            - name: MANAGEMENT_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "never"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://otel-collector.base:4318/v1/traces"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_METRICS_TAGS_ENVIRONMENT
              value: "server"
            - name: KUMA_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: GATEWAY_ENVIRONMENT
              value: "server"
            - name: GATEWAY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: KUMA_BOOT_WEB_REQUEST_ENABLED
              value: "false"
            - name: KUMA_BOOT_LOGGER_LOGGING_FILES_ENABLED
              value: "false"
            - name: ATLAS_LOG_ENABLED
              value: "false"
            - name: LOGGING_ACCESS_ENABLED
              value: "false"
            - name: KUMA_BOOT_MONITOR_ENABLED
              value: "false"
            - name: UAA_JWK_PRIVATE_KEY
              value: /app/data/uaa-jwt-rsa-private.pem
            # 私钥内容从 Secret 下发，优先于文件；Secret 缺失时回退到 hostPath 文件
            - name: UAA_JWK_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: uaa-jwk-private-key
                  optional: true
            - name: KUMA_UAA_ISSUER
              value: "https://uaa.kumacloud.top"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: nacos-password
            - name: UAA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: uaa-admin-password
            - name: BLOG_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: blog-oauth2-client-secret
            - name: GATEWAY_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: gateway-oauth2-client-secret
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: mysql-root-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: redis-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 19002
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 19002
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: uaa-data
              mountPath: /app/data
            - name: logs
              mountPath: /data/uaa/logs
      volumes:
        - name: uaa-data
          hostPath:
            path: /data/blog/uaa/data
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/blog/uaa/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: uaa
  namespace: base
spec:
  type: ClusterIP
  selector:
    app: uaa
  ports:
    - name: http
      port: 33336
      targetPort: 33336
    - name: management
      port: 19002
      targetPort: 19002
