# 示例模板，勿直接 apply。UAA 部署在 base 命名空间。
# 首次部署请在服务器执行注释中的 kubectl create secret 命令。
apiVersion: v1
kind: Secret
metadata:
  name: kuma-secret
  namespace: base
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME"
  redis-password: "CHANGE_ME"
  uaa-admin-password: "CHANGE_ME"
  blog-oauth2-client-secret: "CHANGE_ME"
  gateway-oauth2-client-secret: "CHANGE_ME"
  nacos-password: "CHANGE_ME"
  # UAA JWT 签名私钥（PKCS#8 PEM 完整内容，含 BEGIN/END 头尾）。可选，缺省时 UAA 回退使用 hostPath 文件
  uaa-jwk-private-key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
