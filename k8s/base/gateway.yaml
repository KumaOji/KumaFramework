apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          # 注意：image 是占位符，CI 部署时先 apply 本清单再 kubectl set image 覆盖为真实镜像。
          # 手动 apply 本文件后必须立即 set image，否则 Pod 会因拉取 placeholder 失败而 ImagePullBackOff
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/gateway:placeholder
          ports:
            - containerPort: 18080
            - containerPort: 18081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,observability
            - name: KUMA_CONFIG_PROFILE
              value: "prod"
            - name: LOGGING_CONFIG
              value: "classpath:logback-gateway.xml"
            - name: MANAGEMENT_SERVER_PORT
              value: "18081"
            - name: MANAGEMENT_SERVER_ADDRESS
              value: "0.0.0.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "never"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://otel-collector.base:4318/v1/traces"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_METRICS_TAGS_ENVIRONMENT
              value: "server"
            - name: KUMA_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_ENVIRONMENT
              value: "server"
            - name: OBSERVABILITY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: GATEWAY_ENVIRONMENT
              value: "server"
            - name: GATEWAY_LOKI_URL
              value: "http://loki.base:3100/loki/api/v1/push"
            - name: KUMA_BOOT_WEB_REQUEST_ENABLED
              value: "false"
            - name: KUMA_BOOT_LOGGER_LOGGING_FILES_ENABLED
              value: "false"
            - name: ATLAS_LOG_ENABLED
              value: "false"
            - name: LOGGING_ACCESS_ENABLED
              value: "false"
            - name: KUMA_BOOT_MONITOR_ENABLED
              value: "false"
            - name: KUMA_BOOT_CORE_ENV
              value: "PRO"
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "false"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.base"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: nacos-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 18081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 18081
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /data/gateway/logs
      volumes:
        - name: logs
          hostPath:
            path: /data/blog/gateway/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: base
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 18080
      targetPort: 18080
    - name: management
      port: 18081
      targetPort: 18081
