apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab
  template:
    metadata:
      labels:
        app: lab
    spec:
      imagePullSecrets:
        - name: observability-registry
      containers:
        - name: lab
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/lab:placeholder
          ports:
            - containerPort: 19090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "19090"
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos.base:8848
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: nacos-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: mysql-root-password
            - name: KUMA_LAB_MONITORING_LOKI_URL
              value: http://loki.base:3100
            - name: KUMA_LAB_MONITORING_PROMETHEUS_URL
              value: http://prometheus.base:9090
            - name: KUMA_LAB_MONITORING_ALERTMANAGER_URL
              value: http://alertmanager.base:9093
            - name: KUMA_LAB_MONITORING_GRAFANA_URL
              value: http://grafana.base:3000
            - name: KUMA_LAB_MONITORING_GRAFANA_UI_URL
              value: http://localhost:23000
            - name: KUMA_LAB_MONITORING_PROMETHEUS_UI_URL
              value: http://localhost:29090
            - name: KUMA_LAB_MONITORING_ALERTMANAGER_UI_URL
              value: http://localhost:29093
            - name: KUMA_LAB_MONITORING_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
                  optional: true
            - name: KUMA_LAB_MONITORING_OTLP_URL
              value: http://otel-collector.base:4318/v1/traces
            - name: KUMA_LAB_MONITORING_SKYWALKING_QUERY_URL
              value: http://skywalking-oap.base:9412
            - name: KUMA_LAB_MONITORING_SKYWALKING_UI_URL
              value: http://localhost:22880
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 19090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 19090
          livenessProbe:
            tcpSocket:
              port: 19090
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lab
  namespace: base
spec:
  selector:
    app: lab
  ports:
    - name: http
      port: 19090
      targetPort: 19090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-internal
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: lab
  policyTypes: [Ingress]
  ingress: []
