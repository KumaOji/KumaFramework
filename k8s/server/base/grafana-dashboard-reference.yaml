apiVersion: v1
data:
  reference.json: "{\n  \"uid\": \"kuma-reference\",\n  \"title\": \"13 · Reference\
    \ · 开发模板观测\",\n  \"description\": \"HTTP、业务变化、运行资源、审计与日志。趋势至少需要两个采样点；无数据不代表零。业务计数是调用增量，不是订单存量。\"\
