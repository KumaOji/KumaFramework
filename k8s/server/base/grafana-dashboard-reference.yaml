    : true,\n        \"allValue\": \".*\",\n        \"current\": {\n          \"text\"\
    : \"All\",\n          \"value\": \"$__all\"\n        }\n      }\n    ]\n  },\n\
    \  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"采集状态（0 失联；无数据表示尚未注册）\"\
