    : \"{{application}}{{service_name}}{{job}}\",\n          \"range\": true\n   \
    \     }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n   \
    \   \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n   \
    \         \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n       \
    \   \"values\": false\n        },\n        \"colorMode\": \"value\",\n       \
    \ \"graphMode\": \"none\"\n      }\n    },\n    {\n      \"id\": 5,\n      \"\
    title\": \"异常采集目标\",\n      \"type\": \"stat\",\n      \"gridPos\": {\n      \
    \  \"x\": 6,\n        \"y\": 5,\n        \"w\": 6,\n        \"h\": 4\n      },\n\
    \      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\":\
    \ \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"sum(1-up)\",\n          \"legendFormat\": \"{{application}}{{service_name}}{{job}}\"\
    ,\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"short\",\n          \"color\"\
    : {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\"\
    : {\n            \"mode\": \"absolute\",\n            \"steps\": [\n         \
    \     {\n                \"color\": \"green\",\n                \"value\": null\n\
    \              },\n              {\n                \"color\": \"red\",\n    \
    \            \"value\": 1\n              }\n            ]\n          }\n     \
    \   },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"\
