  kuma-logs.json: "{\n  \"uid\": \"kuma-logs\",\n  \"title\": \"20 · Loki · 服务日志\"\
    ,\n  \"description\": \"Loki 日志工作台：服务、环境、关键词筛选及 traceId 关联。\",\n  \"tags\": [\n\
    \    \"kuma\",\n    \"observability\",\n    \"loki\"\n  ],\n  \"schemaVersion\"\
    : 39,\n  \"version\": 2,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\"\
    : \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"timezone\": \"browser\",\n  \"links\"\
    : [\n    {\n      \"type\": \"link\",\n      \"title\": \"00 · 可观测性总览\",\n   \
    \   \"url\": \"/d/kuma-overview\",\n      \"icon\": \"dashboard\",\n      \"includeVars\"\
    : true,\n      \"keepTime\": true,\n      \"targetBlank\": false\n    },\n   \
    \ {\n      \"type\": \"link\",\n      \"title\": \"10 · Prometheus · 服务指标\",\n\
    \      \"url\": \"/d/kuma-services\",\n      \"icon\": \"dashboard\",\n      \"\
    includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\": false\n\
    \    },\n    {\n      \"type\": \"link\",\n      \"title\": \"11 · Prometheus\
    \ · Gateway 网关\",\n      \"url\": \"/d/kuma-gateway\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"12 · Prometheus\
    \ · 监控组件\",\n      \"url\": \"/d/kuma-monitoring\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"20 · Loki\
    \ · 服务日志\",\n      \"url\": \"/d/kuma-logs\",\n      \"icon\": \"dashboard\",\n\
    \      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"30 · SkyWalking\
    \ · 调用链\",\n      \"url\": \"/d/kuma-traces\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"\
    name\": \"application\",\n        \"label\": \"服务\",\n        \"type\": \"custom\"\
    ,\n        \"query\": \"kuma-cloud-blog,kuma-cloud-uaa,kuma-cloud-gateway,kuma-reference\"\
    ,\n        \"multi\": true,\n        \"includeAll\": true,\n        \"current\"\
    : {\n          \"text\": \"全部\",\n          \"value\": \"$__all\"\n        },\n\
    \        \"allValue\": \"kuma-cloud-(blog|uaa|gateway)|kuma-reference\"\n    \
    \  },\n      {\n        \"name\": \"environment\",\n        \"label\": \"环境\"\
    ,\n        \"type\": \"custom\",\n        \"query\": \"wsl,server\",\n       \
    \ \"multi\": true,\n        \"includeAll\": true,\n        \"current\": {\n  \
    \        \"text\": \"全部\",\n          \"value\": \"$__all\"\n        },\n    \
    \    \"allValue\": \".*\"\n      },\n      {\n        \"name\": \"search\",\n\
    \        \"label\": \"关键词\",\n        \"type\": \"textbox\",\n        \"query\"\
    : \"\",\n        \"current\": {\n          \"text\": \"\",\n          \"value\"\
    : \"\"\n        },\n        \"options\": [\n          {\n            \"text\"\
    : \"\",\n            \"value\": \"\",\n            \"selected\": true\n      \
    \    }\n        ]\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\"\
    : 1,\n      \"title\": \"筛选与关联\",\n      \"type\": \"text\",\n      \"gridPos\"\
    : {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\":\
    \ 3\n      },\n      \"options\": {\n        \"mode\": \"markdown\",\n       \
    \ \"content\": \"顶部选择服务、环境，输入关键词即可搜索。日志保留原始 JSON，展开日志详情中的 **traceId** 可跳到 SkyWalking\
    \ 链路。\\n\\n[查看服务指标](/d/kuma-services) · [调用链工作台](/d/kuma-traces)\"\n      }\n\
    \    },\n    {\n      \"id\": 2,\n      \"title\": \"日志速率 · 条/秒\",\n      \"type\"\
    : \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 3,\n\
    \        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n   \
    \     \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"targets\"\
    : [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by(service_name)(rate(({service_name=~\\\
    \"$application\\\",environment=~\\\"$environment\\\"} |= ${search:doublequote})[5m]))\"\
    ,\n          \"queryType\": \"range\",\n          \"editorMode\": \"code\",\n\
    \          \"maxLines\": 200\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"ops\"\n        },\n        \"\
    overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n     \
    \     \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n      \
    \  },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\"\
    : \"desc\"\n        }\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\"\
    : \"WARN / ERROR 日志速率 · 条/秒\",\n      \"type\": \"timeseries\",\n      \"gridPos\"\
    : {\n        \"x\": 12,\n        \"y\": 3,\n        \"w\": 12,\n        \"h\"\
    : 7\n      },\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"\
    uid\": \"loki\"\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"expr\": \"sum by(service_name)(rate(({service_name=~\\\"\
    $application\\\",environment=~\\\"$environment\\\"} |= ${search:doublequote} |\
    \ json | level=~\\\"(?i)warn|error|fatal\\\")[5m]))\",\n          \"queryType\"\
    : \"range\",\n          \"editorMode\": \"code\",\n          \"maxLines\": 200\n\
    \        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n    \
    \      \"unit\": \"ops\"\n        },\n        \"overrides\": []\n      },\n  \
    \    \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\"\
    ,\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n \
    \         \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n    \
    \  }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"服务日志 · 最新 200 条\",\n\
    \      \"type\": \"logs\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"\
    y\": 10,\n        \"w\": 24,\n        \"h\": 16\n      },\n      \"datasource\"\
    : {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"\
    targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"{service_name=~\\\
    \"$application\\\",environment=~\\\"$environment\\\"} |= ${search:doublequote}\"\
    ,\n          \"queryType\": \"range\",\n          \"editorMode\": \"code\",\n\
    \          \"maxLines\": 200\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"\
    overrides\": []\n      },\n      \"options\": {\n        \"showTime\": true,\n\
    \        \"showLabels\": false,\n        \"wrapLogMessage\": true,\n        \"\
    sortOrder\": \"Descending\",\n        \"enableLogDetails\": true,\n        \"\
    dedupStrategy\": \"none\"\n      },\n      \"description\": \"可展开 JSON 字段和 traceId；关键词按原文匹配。范围过大时可缩短顶部时间范围。\"\
    \n    }\n  ]\n}\n"
  kuma-monitoring.json: "{\n  \"uid\": \"kuma-monitoring\",\n  \"title\": \"12 · Prometheus\
    \ · 监控组件\",\n  \"description\": \"Prometheus 采集的监控组件进程指标；不等同于节点或容器资源指标。\",\n \
    \ \"tags\": [\n    \"kuma\",\n    \"observability\",\n    \"prometheus\"\n  ],\n\
    \  \"schemaVersion\": 39,\n  \"version\": 2,\n  \"refresh\": \"30s\",\n  \"time\"\
    : {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"timezone\": \"\
    browser\",\n  \"links\": [\n    {\n      \"type\": \"link\",\n      \"title\"\
    : \"00 · 可观测性总览\",\n      \"url\": \"/d/kuma-overview\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"10 · Prometheus\
    \ · 服务指标\",\n      \"url\": \"/d/kuma-services\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"11 · Prometheus\
    \ · Gateway 网关\",\n      \"url\": \"/d/kuma-gateway\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"12 · Prometheus\
    \ · 监控组件\",\n      \"url\": \"/d/kuma-monitoring\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"20 · Loki\
    \ · 服务日志\",\n      \"url\": \"/d/kuma-logs\",\n      \"icon\": \"dashboard\",\n\
    \      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    },\n    {\n      \"type\": \"link\",\n      \"title\": \"30 · SkyWalking\
    \ · 调用链\",\n      \"url\": \"/d/kuma-traces\",\n      \"icon\": \"dashboard\"\
    ,\n      \"includeVars\": true,\n      \"keepTime\": true,\n      \"targetBlank\"\
    : false\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"\
    name\": \"job\",\n        \"label\": \"监控组件\",\n        \"type\": \"custom\",\n\
    \        \"query\": \"prometheus,grafana,loki,alertmanager,skywalking-oap\",\n\
    \        \"multi\": true,\n        \"includeAll\": true,\n        \"current\"\
    : {\n          \"text\": \"全部\",\n          \"value\": \"$__all\"\n        },\n\
    \        \"allValue\": \"prometheus|grafana|loki|alertmanager|skywalking-oap\"\
    \n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\"\
    : \"组件采集状态 · 1 正常 / 0 失联\",\n      \"type\": \"stat\",\n      \"gridPos\": {\n\
    \        \"x\": 0,\n        \"y\": 0,\n        \"w\": 24,\n        \"h\": 5\n\
    \      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n      \
    \  \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n      \
    \    \"refId\": \"A\",\n          \"expr\": \"up{job=~\\\"$job\\\"}\",\n     \
    \     \"legendFormat\": \"{{application}}{{service_name}}{{job}}\",\n        \
    \  \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"\
    defaults\": {\n          \"min\": 0,\n          \"max\": 1,\n          \"color\"\
    : {\n            \"mode\": \"thresholds\"\n          },\n          \"thresholds\"\
    : {\n            \"mode\": \"absolute\",\n            \"steps\": [\n         \
    \     {\n                \"color\": \"red\",\n                \"value\": null\n\
    \              },\n              {\n                \"color\": \"green\",\n  \
    \              \"value\": 1\n              }\n            ]\n          }\n   \
    \     },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"\
    reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n    \
    \      ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n\
    \        \"colorMode\": \"value\",\n        \"graphMode\": \"none\"\n      }\n\
    \    },\n    {\n      \"id\": 2,\n      \"title\": \"进程 CPU 使用 · 核数\",\n     \
    \ \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n       \
    \ \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n        \
    \  \"expr\": \"sum by(job)(rate(process_cpu_seconds_total{job=~\\\"$job\\\"}[5m]))\"\
    ,\n          \"legendFormat\": \"{{application}}{{service_name}}{{job}}\",\n \
    \         \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n   \
    \     \"defaults\": {\n          \"unit\": \"cores\"\n        },\n        \"overrides\"\
    : []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\"\
    : \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\"\
    : {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n\
    \      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"进程常驻内存\",\n    \
    \  \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n     \
    \   \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n        \
    \  \"expr\": \"process_resident_memory_bytes{job=~\\\"$job\\\"}\",\n         \
    \ \"legendFormat\": \"{{application}}{{service_name}}{{job}}\",\n          \"\
    range\": true\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"unit\": \"bytes\"\n        },\n        \"overrides\": []\n  \
    \    },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\"\
    : \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\"\
    : {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n\
    \      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"采集耗时\",\n      \"\
    type\": \"timeseries\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\"\
    : 13,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n\
    \        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n\
    \      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"scrape_duration_seconds{job=~\\\"$job\\\"}\",\n          \"legendFormat\"\
    : \"{{application}}{{service_name}}{{job}}\",\n          \"range\": true\n   \
    \     }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"\
    options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n  \
    \        \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n     \
    \     \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      }\n\
    \    },\n    {\n      \"id\": 5,\n      \"title\": \"每次采集样本数\",\n      \"type\"\
    : \"timeseries\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 13,\n\
    \        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n   \
    \     \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n \
    \     \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"scrape_samples_scraped{job=~\\\"$job\\\"}\",\n          \"legendFormat\":\
    \ \"{{application}}{{service_name}}{{job}}\",\n          \"range\": true\n   \
    \     }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n   \
    \   \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\"\
    ,\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n \
    \         \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n    \
    \  }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"正在触发的告警\",\n      \"\
    type\": \"table\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 21,\n\
    \        \"w\": 24,\n        \"h\": 7\n      },\n      \"datasource\": {\n   \
    \     \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n \
    \     \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\"\
    : \"ALERTS{alertstate=\\\"firing\\\"}\",\n          \"legendFormat\": \"{{application}}{{service_name}}{{job}}\"\
    ,\n          \"range\": true\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"\
    overrides\": []\n      },\n      \"description\": \"空表表示当前没有正在触发的告警。\",\n    \
    \  \"options\": {\n        \"showHeader\": true\n      }\n    }\n  ]\n}\n"
  kuma-overview.json: "{\n  \"uid\": \"kuma-overview\",\n  \"title\": \"00 · 可观测性总览\"\
    ,\n  \"description\": \"从服务健康、指标、日志进入调用链。默认最近一小时，30 秒刷新。\",\n  \"tags\": [\n \
    \   \"kuma\",\n    \"observability\",\n    \"prometheus\"\n  ],\n  \"schemaVersion\"\
    : 39,\n  \"version\": 2,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\"\
    : \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"timezone\": \"browser\",\n  \"links\"\
    : [\n    {\n      \"type\": \"link\",\n      \"title\": \"00 · 可观测性总览\",\n   \
