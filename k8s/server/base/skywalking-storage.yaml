apiVersion: v1
kind: Service
metadata:
  name: skywalking-storage
  namespace: base
spec:
  ports:
  - name: http
    port: 9200
  selector:
    app: skywalking-storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skywalking-storage
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skywalking-storage
  serviceName: skywalking-storage
  template:
    metadata:
      labels:
        app: skywalking-storage
    spec:
      containers:
      - env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: node.store.allow_mmap
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/observability-elasticsearch:8.17.3
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        name: elasticsearch
        ports:
        - containerPort: 9200
          name: http
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=1s
            port: http
          timeoutSeconds: 3
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /_cluster/health
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /usr/share/elasticsearch/data
          name: data
      imagePullSecrets:
      - name: observability-registry
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
