apiVersion: v1
data:
  config.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n\
    \  instance_addr: 127.0.0.1\n  path_prefix: /var/loki\n  storage:\n    filesystem:\n\
    \      chunks_directory: /var/loki/chunks\n      rules_directory: /var/loki/rules\n\
    \  replication_factor: 1\n  ring:\n    kvstore:\n      store: inmemory\nschema_config:\n\
    \  configs:\n    - from: 2024-01-01\n      store: tsdb\n      object_store: filesystem\n\
    \      schema: v13\n      index:\n        prefix: index_\n        period: 24h\n\
    storage_config:\n  tsdb_shipper:\n    active_index_directory: /var/loki/tsdb-index\n\
    \    cache_location: /var/loki/tsdb-cache\ncompactor:\n  working_directory: /var/loki/compactor\n\
    \  retention_enabled: true\n  delete_request_store: filesystem\nlimits_config:\n\
    \  retention_period: 168h\n  allow_structured_metadata: true\nanalytics:\n  reporting_enabled:\
    \ false\n"
kind: ConfigMap
metadata:
  name: loki-config
  namespace: base
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: base
spec:
  ports:
  - name: http
    port: 3100
    targetPort: http
  selector:
    app: loki
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  serviceName: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - args:
        - -config.file=/etc/loki/config.yaml
        image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/observability-loki:3.7.8
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        name: loki
        ports:
        - containerPort: 3100
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          timeoutSeconds: 3
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /var/loki
          name: data
        - mountPath: /etc/loki
          name: config
          readOnly: true
      imagePullSecrets:
      - name: observability-registry
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
      - configMap:
          name: loki-config
        name: config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
