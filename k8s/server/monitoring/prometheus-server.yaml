apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: base
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: server
    rule_files:
      - /etc/prometheus/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [prometheus:9090]
      - job_name: alertmanager
        static_configs:
          - targets: [alertmanager:9093]
      - job_name: loki
        static_configs:
          - targets: [loki:3100]
      - job_name: grafana
        static_configs:
          - targets: [grafana:3000]
      - job_name: skywalking-oap
        static_configs:
          - targets: [skywalking-oap-metrics:1234]
      - job_name: gateway
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [gateway.base:18081]
      - job_name: blog
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [blog-background.blog:19001]
      - job_name: uaa
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [uaa.base:19002]
