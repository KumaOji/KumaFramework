#description为插件的描述，version为插件的版本号，name为插件的名称，site指示插件是否包含Web资源，java.version指定插件需要的Java版本，classname指定插件的主类名。
description=My Elasticsearch plugin
version=1.0
name=my-plugin
site=false
java.version=1.8
classname=com.example.MyPlugin

#Elasticsearch插件可以分为以下几类：  https://blog.csdn.net/Aqu415/article/details/130158180
#
#分析插件：用于添加新的分析器、过滤器或标记器等。
#发现插件：用于添加新的发现机制或检测服务。
#读写插件：用于添加新的读写操作或修改现有操作。
#索引插件：用于添加新的索引存储类型或修改现有存储类型。
#脚本插件：用于添加新的查询语言或修改现有查询语言。
#其他插件：包括各种其他类型的插件，例如安全插件、监控插件等。

#1. 插件分类
#API Extension Plugins API扩展插件
#通过添加新的API或功能向Elasticsearch添加新功能，通常与搜索或映射有关。
#优秀插件代表：
#SQL language Plugin: 让 Elasticsearch 支持 SQL语句查询 (by NLPchina)
#
#Alerting Plugins 告警插件
#监控Elasticsearch索引情况，并在超过某个阈值时触发告警。
#优秀插件代表：
#X-Pack
#
#Analysis Plugins 分析插件
#扩展索引的分析规则，比如各种分词插件
#优秀插件代表：
#IK Analysis Plugin 中文分词
#Japanese(Kuromoji) Analysis plugin 日文分词
#PinyinAnalysis Plugin 拼音分词
#
#Discovery Plugins 发现插件
#通过添加可用于代替Zen Discovery的新发现机制来扩展Elasticsearch 。
#
#Ingest Plugins 提取插件
#增强每个节点的功能。
#优秀插件代表：
#Ingest Attachment Processor Plugin 让每个节点都可以处理附件文件
#
#Management Plugins 管理插件
#管理Es集群
#优秀插件代表：X-Pack
#
#Mapper Plugins 映射插件
#主要用来扩展es数据类型
#
#Scripting Plugins 脚本插件
#主要用来扩展es的脚本功能，让es支持使用其他脚本语言。
#优秀插件代表：
#JavaScript Language
#Python Language
#
#Security Plugins 安全插件
#扩展es的安全策略，比如控制api的访问权限等
#优秀插件代表：X-Pack
#
#Snapshot/Restore Repository Plugins 快照/还原存储库插件
#扩展es的快照和恢复功能
#
#Store Plugins 存储插件
#扩展es的存储方式，es默认使用的是Lucene存储数据的
#优秀插件代表：
#Store SMB Windows SMB
#ActionPlugin：Rest api接口请求插件。开发者可以开发自身需要的rest命令，也可以对rest请求进行增加处理。如果Elasticsearch内置的命令如_all,cat,/cat/health等rest命令无法满足需求,开发者可以自己开发需要的rest命令。
#AnalysisPlugin：分析插件，扩展索引分析功能，用于增强ES自身分析功能的不足，例如大家熟知的IK分词插件。
#IngestPlugin：预处理插件。在数据索引之前进行预处理，例如根据ip来增加地理信息的geoip processor plugin。
#MapperPlugin：映射插件。增强ES的数据类型。
#NetworkPlugin：网络传输插件。
#ScriptPlugin：脚本插件。主要用于扩展ES的脚本功能，比如自定义方法打分，让ES支持其他脚本语言。
#SearchPlugin：查询插件。扩展ES的查询功能。


#https://www.elastic.co/guide/en/elasticsearch/plugins/master/example-text-analysis-plugin.html
