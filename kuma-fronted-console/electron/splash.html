<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Kuma Console</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c1f24;color:#e2e8f0;font:15px "Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;height:100vh}.titlebar{position:fixed;inset:0 0 auto;height:36px;background:#1c1f24;-webkit-app-region:drag;color:#cbd5e1;font-size:12px;padding:9px 18px}.card{text-align:center;width:min(660px,80vw)}.logo{background:#345df1;color:white;border-radius:6px;margin:auto;width:80px;height:80px;display:grid;place-items:center;font-size:46px;font-weight:800;box-shadow:none}h1{font-size:24px;margin:28px 0 8px}p{color:#94a3b8;line-height:1.8}.loader{height:4px;background:#24324d;border-radius:9px;margin:32px auto;width:200px;overflow:hidden}.loader:after{content:'';display:block;height:100%;width:45%;background:#345df1;animation:loading 1.2s ease-in-out infinite}@keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(320%)}}#startup-message{white-space:pre-wrap;overflow-wrap:anywhere;max-height:380px;overflow:auto}.failed .loader{display:none}.failed #startup-message{color:#b33c43}
</style><body><div class="titlebar">Kuma Console</div><div class="card"><div class="logo">K</div><h1>Kuma Console</h1><p id="startup-message">正在连接本机监控服务…<br>首次启动会构建后端，请稍候。</p><div class="loader"></div></div></body></html>
