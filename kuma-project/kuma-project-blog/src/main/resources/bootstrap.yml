spring:
  application:
    name: kuma-cloud-blog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - "optional:nacos:kuma-shared-${spring.profiles.active}.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:kuma-cloud-blog-${spring.profiles.active}.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
      password: ${SPRING_CLOUD_NACOS_PASSWORD:123456}
      server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
      discovery:
        enabled: true
        register-enabled: true
        namespace: base
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
      config:
        enabled: true
        namespace: base
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
