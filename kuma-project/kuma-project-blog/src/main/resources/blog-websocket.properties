# Blog defaults; environment/application/Nacos properties can override these values.
kuma.boot.websocket.stomp.enabled=true
kuma.boot.websocket.stomp.endpoint=/ws/chat
kuma.boot.websocket.stomp.broker-prefixes=/topic
kuma.boot.websocket.stomp.application-destination-prefixes=/app
kuma.boot.websocket.stomp.allowed-origin-patterns=*
kuma.boot.websocket.stomp.sockjs-enabled=true
kuma.boot.websocket.stomp.native-endpoint-enabled=false
# Blog handles Cookie JWT, chat permissions and blacklist checks on handshake and inbound frames.
kuma.boot.websocket.stomp.principal-authentication-enabled=false
kuma.boot.websocket.stomp.cluster-enabled=false
