# Blog 后端部署在 blog 命名空间，连接 base 命名空间基础设施。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-background
  namespace: blog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blog-background
  template:
    metadata:
      labels:
        app: blog-background
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: blog-background
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/blog:placeholder
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos.base:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: nacos-password
            - name: SPRING_CONFIG_IMPORT
              value: "optional:nacos:kuma-shared-prod.yaml?group=DEFAULT_GROUP&refreshEnabled=true,optional:nacos:kuma-cloud-blog-prod.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: admin-initial-password
            - name: MYSQL_URL
              value: "jdbc:mysql://mysql.base:3306/base?useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: mysql-root-password
            - name: REDIS_HOST
              value: redis.base
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DATABASE
              value: "0"
            - name: BLOG_OAUTH2_CLIENT_ID
              value: blog
            - name: BLOG_OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: blog-oauth2-client-secret
            - name: BLOG_OAUTH2_AUTHORIZATION_URI
              value: "https://blog.kumacloud.top/uaa/oauth2/authorize"
            - name: BLOG_OAUTH2_TOKEN_URI
              value: "http://uaa.base:33336/oauth2/token"
            - name: BLOG_OAUTH2_JWK_SET_URI
              value: "http://uaa.base:33336/oauth2/jwks"
            - name: BLOG_OAUTH2_USER_INFO_URI
              value: "http://uaa.base:33336/userinfo"
            - name: BLOG_OAUTH2_ISSUER_URI
              value: "https://blog.kumacloud.top/uaa"
            - name: BLOG_OAUTH2_AUDIENCE
              value: blog
            - name: BLOG_OAUTH2_UAA_URI
              value: "http://uaa.base:33336"
            - name: BLOG_LOGIN_SUCCESS_URL
              value: "https://blog.kumacloud.top/"
            # 外部 LLM API（OpenAI / 兼容接口）
            - name: AI_CHAT_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-base-url
            - name: AI_CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-api-key
            - name: AI_CHAT_MODEL
              valueFrom:
                secretKeyRef:
                  name: blog-secret
                  key: ai-chat-model
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: music
              mountPath: /data/music
            - name: logs
              mountPath: /data/blog/logs
      volumes:
        - name: music
          hostPath:
            path: /data/blog/background/music
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/blog/background/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: blog-background
  namespace: blog
spec:
  selector:
    app: blog-background
  ports:
    - port: 9000
      targetPort: 9000
