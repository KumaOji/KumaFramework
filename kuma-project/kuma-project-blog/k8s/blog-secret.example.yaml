# 示例模板，勿直接 apply。首次部署请在服务器执行：
# kubectl -n base create secret generic blog-secret \
#   --from-literal=mysql-root-password='YOUR_MYSQL_PASSWORD' \
#   --from-literal=admin-initial-password='YOUR_ADMIN_PASSWORD' \
#   --from-literal=ai-chat-base-url='YOUR_AI_BASE_URL' \
#   --from-literal=ai-chat-api-key='YOUR_AI_API_KEY' \
#   --from-literal=ai-chat-model='YOUR_AI_MODEL' \
#   --from-literal=openwebui-secret-key='YOUR_OPENWEBUI_SECRET' \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: blog-secret
  namespace: base
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME"
  admin-initial-password: "CHANGE_ME"
  ai-chat-base-url: "CHANGE_ME"
  ai-chat-api-key: "CHANGE_ME"
  ai-chat-model: "CHANGE_ME"
  openwebui-secret-key: "CHANGE_ME"
