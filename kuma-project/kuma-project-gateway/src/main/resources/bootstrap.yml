spring:
  application:
    name: kuma-cloud-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      username: nacos
      password: 123456
      server-addr: 172.23.89.45:8848
      discovery:
        enabled: true
        register-enabled: true
        namespace: base
        server-addr: 172.23.89.45:8848
      config:
        enabled: true
        namespace: base
        server-addr: 172.23.89.45:8848
        file-extension: yaml
        shared-configs:
          - data-id: kuma-shared-dev.yaml
            group: DEFAULT_GROUP
            refresh: true
