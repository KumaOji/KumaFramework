server:
  port: 18080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          # 与 UAA 的 kuma.uaa.issuer 保持一致；开启鉴权时用于校验 JWT 签名与 iss
          issuer-uri: ${GATEWAY_JWT_ISSUER_URI:http://127.0.0.1:33336}
  data:
    redis:
      timeout: 3s
  cloud:
    gateway:
      server:
        webflux:
          # SCG 5 路由前缀（旧版 spring.cloud.gateway.routes 已失效）
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
            pool:
              type: elastic
              max-connections: 500
          metrics:
            enabled: true
          observability:
            enabled: true
          default-filters:
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            # UAA：/uaa/oauth2/token → 127.0.0.1:33336/oauth2/token
            - id: uaa
              uri: http://127.0.0.1:33336
              predicates:
                - Path=/uaa/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: uaa
                    fallbackUri: forward:/fallback/uaa
            # Blog：/blog/posts → 127.0.0.1:9000/api/posts（blog context-path=/api）
            - id: blog
              uri: http://127.0.0.1:9000
              predicates:
                - Path=/blog/**
              filters:
                - RewritePath=/blog/(?<segment>.*), /api/${segment}
                - name: CircuitBreaker
                  args:
                    name: blog
                    fallbackUri: forward:/fallback/blog
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userOrIpKeyResolver}"

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      blog:
        base-config: default
      uaa:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,kmc,kmchealth,kmcstartup,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  health:
    kmc:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true

info:
  app:
    name: gateway
    description: Kuma 体系统一网关
    version: 1.0.0

logging:
  level:
    root: INFO
    com.kuma.cloud.gateway: INFO
    org.springframework.cloud.gateway: INFO

# ── Knife4j 文档聚合（手动模式，按路由前缀拉取下游 OpenAPI） ─────────────────
knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: blog
        url: /blog/v3/api-docs
        service-name: blog
        order: 1

# ── Kuma 框架配置（与 project4 / blog 风格对齐） ─────────────────────────────
kuma:
  boot:
    core:
      enabled: true
      env: DEV
      collect-hook-enabled: false
      context-restart-enabled: false
    actuator:
      managedresource:
        enabled: false
    prometheus:
      enabled: true
    # 网关无 MyBatis / MVC Controller，关闭 monitor 采集器，保留 Prometheus + SCG metrics 即可
    monitor:
      enabled: false
    ip2region:
      # 需要访问日志 geo= 归属地时置 true，并确保 classpath:ip2region/ip2region.xdb 存在
      enabled: false
    logger:
      enabled: true
      logging:
        console:
          enabled: true
          close-after-start: false
        files:
          enabled: false
        logstash:
          enabled: false
          destinations: 127.0.0.1:5000
        loki:
          enabled: false
          http-url: http://localhost:3100/loki/api/v1/push
  cloud:
    gateway:
      enabled: true
      trust-proxy-headers: false
      cors:
        enabled: true
        allowed-origin-patterns:
          - "*"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - PATCH
          - HEAD
        allowed-headers:
          - "*"
        exposed-headers:
          - kmc-trace-id
          - X-Response-Time
          - X-RateLimit-Remaining
          - X-RateLimit-Burst-Capacity
          - X-RateLimit-Replenish-Rate
        allow-credentials: false
        max-age: 1h
      auth:
        # 本地开发默认关闭 JWT 校验；生产环境置 true 并确保 UAA 可访问
        enabled: false
        white-list:
          - /actuator/**
          - /fallback/**
          - /uaa/**
          - /oauth2/**
          - /login
          - /logout
          - /captcha
          - /doc.html
          - /webjars/**
          - /v3/api-docs/**
          - /favicon.ico
        authorities-claim: authorities
        username-claim: preferred_username
        relay-identity: true
      access:
        enabled: false
      log:
        enabled: true
        slow-threshold: 2s
        response-time-header: true
      rate-limit:
        fallback-to-ip: true
        include-path: false

# monitor 组件扫描兜底：无对应框架时勿增强（框架侧已加 @ConditionalOnClass，此处双保险）
actuator:
  db:
    mybatis:
      enhance:
        enable: false
  http:
    enhance:
      enable: false
  redis:
    template:
      enhance:
        enable: false
