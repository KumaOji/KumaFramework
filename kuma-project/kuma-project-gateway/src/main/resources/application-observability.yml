# 启动时追加 observability profile，例如 dev,observability。
logging:
  config: classpath:logback-gateway.xml

spring:
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
            tags:
              path:
                enabled: false
          observability:
            enabled: true

management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:18081}
    address: ${GATEWAY_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${GATEWAY_TRACING_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${GATEWAY_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${GATEWAY_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
        spring.cloud.gateway.requests: 50ms,100ms,250ms,500ms,1s,2s,5s

gateway:
  loki-url: ${GATEWAY_LOKI_URL:http://localhost:3100/loki/api/v1/push}
  environment: ${GATEWAY_ENVIRONMENT:local}
