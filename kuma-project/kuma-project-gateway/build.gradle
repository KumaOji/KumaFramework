plugins {
    alias(projectLibs.plugins.springboot)
    alias(projectLibs.plugins.spring.dependency.management)
    alias(projectLibs.plugins.gradle.git.properties)   // com.gorylenko.gradle-git-properties
}

description = 'Kuma 体系统一网关（Gateway）—— 基于 Spring Cloud Gateway（WebFlux）的响应式流量入口，提供路由转发、JWT 统一鉴权、身份透传、限流熔断、IP 访问控制、统一错误响应与全链路访问日志'

def springBootVersion = projectLibs.versions.springboot.get()
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // ── Kuma 框架（栈无关能力） ───────────────────────────────────────────
    api project(':kuma-boot-framework:kuma-boot-starter-common')
    api project(':kuma-boot-framework:kuma-boot-starter-core')
    // Actuator 扩展（/actuator/kmc、KmcInfoContributor、KmcHealthIndicator 等）
    api project(':kuma-boot-framework:kuma-boot-starter-prometheus')
    // 统一 Logback 输出（控制台 / Logstash / Loki），不引入 Servlet 栈
    api(project(':kuma-boot-framework:kuma-boot-starter-logger')) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
    // IP 归属地解析（访问日志 geo=），不引入 Servlet 栈
    api(project(':kuma-boot-framework:kuma-boot-starter-ip2region')) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    }
    api project(':kuma-cloud-framework:kuma-cloud-starter-bootstrap')

    // ── Spring Cloud Gateway（WebFlux 响应式网关） ─────────────────────────
    api platform(projectLibs.spring.cloud.dependencies)
    // Spring Cloud Gateway 5.x renamed the starter; BOM is nested so must be imported explicitly
    api platform(projectLibs.spring.cloud.gateway.dependencies)
    api projectLibs.spring.cloud.starter.gateway.server.webflux
    api 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    api 'org.springframework.cloud:spring-cloud-context'
    // 熔断降级：CircuitBreaker 过滤器所需的 Resilience4j 反应式实现
    api 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    api projectLibs.spring.boot.autoconfigure
    api projectLibs.spring.boot.starter.webflux
    api projectLibs.reactor.core

    // ── 统一鉴权：JWT 资源服务器（校验 UAA 签发的 RS256 令牌） ───────────────
    api projectLibs.spring.boot.starter.security
    api projectLibs.spring.boot.starter.oauth2.resource.server

    // ── 分布式限流：RequestRateLimiter + RedisRateLimiter 依赖反应式 Redis ──
    api projectLibs.spring.boot.starter.data.redis.reactive

    api projectLibs.spring.boot.starter.validation
    // 文档聚合（见 application-dev.yml 中 knife4j.gateway）
    api projectLibs.knife4j.gateway

    // Result / TraceUtils / IpAddressMatcher 等方法签名引用了 Servlet API
    compileOnly projectLibs.jakarta.servlet.api

    compileOnly projectLibs.lombok
    annotationProcessor projectLibs.lombok

    testImplementation projectLibs.spring.boot.starter.test
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def gwRedisHost     = project.findProperty('redis.host')     ?: ''
def gwRedisPort     = project.findProperty('redis.port')     ?: ''
def gwRedisDatabase = project.findProperty('redis.database') ?: ''
def gwRedisPassword = project.findProperty('redis.password') ?: ''

processResources {
    filesMatching('**/application.yml') {
        expand(
                active         : 'dev',
                redis_host     : gwRedisHost,
                redis_port     : gwRedisPort,
                redis_database : gwRedisDatabase,
                redis_password : gwRedisPassword
        )
    }
}

// Git 属性注入：启动后可通过 GET /actuator/info 查看当前部署的 commit 信息
apply from: rootProject.file('gradle/git.gradle')

tasks.named('generateGitProperties') { enabled = false }

bootJar {
    archiveBaseName = 'gateway'
}
