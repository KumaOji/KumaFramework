rule_files:
  - /etc/prometheus/rules.yml
evaluation_interval: 1m
tests:
  - name: sustained-errors-trigger-after-five-minutes
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="kuma-cloud-gateway",status="500"}'
        values: '0+6x10'
      - series: 'http_server_requests_seconds_count{application="kuma-cloud-gateway",status="200"}'
        values: '0+54x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kuma-cloud-gateway
            exp_annotations:
              summary: Gateway 5xx error rate exceeds 5 percent
  - name: healthy-requests-do-not-trigger-errors
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="kuma-cloud-gateway",status="500"}'
        values: '0+0x10'
      - series: 'http_server_requests_seconds_count{application="kuma-cloud-gateway",status="200"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayHighErrorRate
        exp_alerts: []
  - name: sustained-high-p95-triggers-latency
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="kuma-cloud-gateway",le="0.1"}'
        values: '0+10x10'
      - series: 'http_server_requests_seconds_bucket{application="kuma-cloud-gateway",le="1"}'
        values: '0+25x10'
      - series: 'http_server_requests_seconds_bucket{application="kuma-cloud-gateway",le="2"}'
        values: '0+30x10'
      - series: 'http_server_requests_seconds_bucket{application="kuma-cloud-gateway",le="5"}'
        values: '0+55x10'
      - series: 'http_server_requests_seconds_bucket{application="kuma-cloud-gateway",le="+Inf"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayHighLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              service: kuma-cloud-gateway
            exp_annotations:
              summary: Gateway P95 request latency exceeds two seconds
