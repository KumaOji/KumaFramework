apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: crpi-1obf2jefhlbm76al.cn-guangzhou.personal.cr.aliyuncs.com/kumaoji/gateway:placeholder
          ports:
            - containerPort: 18080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: KUMA_BOOT_MONITOR_ENABLED
              value: "false"
            - name: KUMA_BOOT_CORE_ENV
              value: "PRO"
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "false"
            - name: SPRING_DATA_REDIS_HOST
              value: "blog-redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: "nacos:8848"
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuma-secret
                  key: nacos-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 18080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /data/gateway/logs
      volumes:
        - name: logs
          hostPath:
            path: /data/blog/gateway/logs
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: base
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 18080
      targetPort: 18080
