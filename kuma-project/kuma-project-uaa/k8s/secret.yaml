# blog 命名空间已存在，无需单独创建 namespace。
# 首次部署前在服务器执行（替换占位值为真实密钥）：
# kubectl -n blog create secret generic kuma-secret \
#   --from-literal=mysql-root-password='YOUR_MYSQL_PASSWORD' \
#   --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#   --from-literal=uaa-admin-password='YOUR_UAA_ADMIN_PASSWORD' \
#   --from-literal=blog-oauth2-client-secret='YOUR_BLOG_CLIENT_SECRET' \
#   --from-literal=gateway-oauth2-client-secret='YOUR_GATEWAY_CLIENT_SECRET' \
#   --from-literal=nacos-password='YOUR_NACOS_PASSWORD' \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# 若 blog-secret 中已有 mysql/redis 密码，可与 blog-background 保持一致。
apiVersion: v1
kind: Secret
metadata:
  name: kuma-secret
  namespace: blog
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME"
  redis-password: "CHANGE_ME"
  uaa-admin-password: "CHANGE_ME"
  blog-oauth2-client-secret: "CHANGE_ME"
  gateway-oauth2-client-secret: "CHANGE_ME"
  nacos-password: "CHANGE_ME"
