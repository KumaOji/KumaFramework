spring:
  profiles:
    active: ${active}
  application:
    name: kuma-cloud-uaa
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          type: com.zaxxer.hikari.HikariDataSource
          url: ${mysql_url}
          username: ${mysql_username}
          password: ${mysql_password}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${redis_host}
      port: ${redis_port}
      database: ${redis_database}
      password: ${redis_password}
      jedis:
        pool:
          max-active: ${redis_jedis_pool_max_active}
          max-idle: ${redis_jedis_pool_max_idle}
          min-idle: ${redis_jedis_pool_min_idle}

server:
  port: 33336
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: UAA_SESSION
        http-only: true
        same-site: lax

kuma:
  uaa:
    issuer: http://127.0.0.1:33336
    jwk:
      private-key-location: ./data/uaa-jwt-rsa-private.pem
    token:
      access-token-ttl: 30m
      refresh-token-ttl: 30d
      authorization-code-ttl: 5m
      reuse-refresh-tokens: false
    captcha:
      enabled: true
      length: 4
      ttl: 2m
    login:
      max-fail-count: 5
      lock-duration: 15m
    mfa:
      issuer: KumaCloud
      bind-ttl: 10m
    admin:
      init-enabled: true
      username: admin
      password: admin123
      nickname: 超级管理员
      email: admin@kumacloud.top
