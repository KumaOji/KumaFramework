<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Kuma UAA · 统一登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
        }

        /* 左侧品牌面板 */
        .brand-panel {
            flex: 1;
            background: linear-gradient(160deg, #1a1f3a 0%, #2d1b4e 55%, #0f2847 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 56px;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 90, 255, .35), transparent 70%);
            top: -150px;
            right: -150px;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 255, .25), transparent 70%);
            bottom: -120px;
            left: -100px;
        }

        .brand-top { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }

        .brand-top .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7a5cff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-top span { font-size: 17px; font-weight: 600; letter-spacing: .5px; }

        .brand-mid { position: relative; z-index: 1; }

        .brand-mid h2 {
            font-size: 34px;
            line-height: 1.4;
            font-weight: 650;
            letter-spacing: .5px;
        }

        .brand-mid p {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, .6);
            line-height: 1.9;
            max-width: 380px;
        }

        .brand-bottom {
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
        }

        /* 右侧表单面板 */
        .form-panel {
            width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 48px;
            color: #111;
        }

        .form-inner { width: 100%; max-width: 340px; }

        .form-inner h1 { font-size: 24px; font-weight: 650; }
        .form-inner .sub { margin: 8px 0 30px; font-size: 13px; color: #888; }

        .alert {
            padding: 10px 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid transparent;
        }

        .alert-error {
            color: #dc2626;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .alert-success {
            color: #16a34a;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #333; }

        input[type=text], input[type=password] {
            width: 100%;
            padding: 11px 13px;
            margin-bottom: 16px;
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            color: #111;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input::placeholder { color: #aaa; }

        input:focus {
            border-color: #6d5cff;
            box-shadow: 0 0 0 4px rgba(109, 92, 255, .1);
        }

        .captcha-row { display: flex; gap: 10px; align-items: flex-start; }
        .captcha-row input { flex: 1; }

        .captcha-row img {
            height: 42px;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: linear-gradient(135deg, #6d5cff, #00c2ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow .2s, transform .15s;
            box-shadow: 0 8px 20px rgba(109, 92, 255, .3);
        }

        button:hover { box-shadow: 0 10px 28px rgba(109, 92, 255, .45); transform: translateY(-1px); }

        .hint { margin-top: 22px; font-size: 12px; color: #999; text-align: center; }

        @media (max-width: 860px) {
            .brand-panel { display: none; }
            .form-panel { width: 100%; min-height: 100vh; }
        }
    </style>
</head>
<body>
<div class="brand-panel">
    <div class="brand-top">
        <div class="logo">K</div>
        <span>Kuma Framework</span>
    </div>
    <div class="brand-mid">
        <h2>一个账号，<br>连接所有应用。</h2>
        <p>Kuma UAA 为你的微服务生态提供统一的身份认证与授权能力，基于 OAuth 2.1 / OpenID Connect 标准协议。</p>
    </div>
    <div class="brand-bottom">© 2026 Kuma Framework · 统一认证授权中心</div>
</div>

<div class="form-panel">
    <div class="form-inner">
        <h1>欢迎回来</h1>
        <p class="sub">登录以继续访问你的应用</p>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-success" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>

        <form method="post" th:action="@{/login}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="username">登录名</label>
            <input type="text" id="username" name="username" placeholder="请输入登录名"
                   autocomplete="username" autofocus required>

            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码"
                   autocomplete="current-password" required>

            <div th:if="${captchaEnabled}">
                <label for="captchaCode">图形验证码</label>
                <div class="captcha-row">
                    <input type="text" id="captchaCode" name="captchaCode" placeholder="验证码"
                           autocomplete="off" required>
                    <img id="captchaImage" alt="点击刷新验证码" title="点击刷新">
                </div>
                <input type="hidden" id="captchaKey" name="captchaKey">
            </div>

            <div th:if="${mfaEnabled}">
                <label for="totpCode">动态码</label>
                <input type="text" id="totpCode" name="totpCode" placeholder="6 位动态验证码"
                       autocomplete="one-time-code" inputmode="numeric" maxlength="6">
            </div>

            <button type="submit">登 录</button>
        </form>

        <p class="hint">登录后将返回发起授权的应用</p>
    </div>
</div>

<script th:if="${captchaEnabled}" th:inline="javascript">
    const captchaUrl = /*[[@{/captcha}]]*/ '/captcha';
    const captchaImage = document.getElementById('captchaImage');
    const captchaKey = document.getElementById('captchaKey');
    const captchaCode = document.getElementById('captchaCode');

    async function refreshCaptcha() {
        try {
            const response = await fetch(captchaUrl, { headers: { 'Accept': 'application/json' } });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const payload = (await response.json())?.data;
            if (!payload?.image || !payload?.captchaKey) {
                throw new Error('invalid captcha payload');
            }
            captchaImage.src = payload.image;
            captchaKey.value = payload.captchaKey;
            captchaCode.value = '';
            captchaImage.alt = '点击刷新验证码';
        } catch (error) {
            console.error('验证码加载失败', error);
            captchaImage.alt = '验证码加载失败，点击重试';
        }
    }

    captchaImage.addEventListener('click', refreshCaptcha);
    refreshCaptcha();
</script>
</body>
</html>
