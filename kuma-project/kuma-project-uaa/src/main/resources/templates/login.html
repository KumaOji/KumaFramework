<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:,">
    <title>Kuma UAA · 统一登录</title>
    <style>
        :root {
            --page: #f1f4fa;
            --surface: #fff;
            --text: #151c33;
            --muted: #53617a;
            --border: #8593ad;
            --soft: #edf2ff;
            --accent: #254acb;
            --focus: #3058dd;
            --action: #254acb;
            --action-hover: #1c3aa5;
            --action-text: #fff;
            --error-bg: #fff2f1;
            --error-text: #a3232b;
            --success-bg: #eaf8ef;
            --success-text: #16613a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            align-items: center;
            padding: clamp(18px, 3vw, 42px);
            background: var(--page);
            color: var(--text);
            font: 16px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        button, input { font: inherit; }
        [hidden] { display: none !important; }

        .login-layout {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            background: var(--surface);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(21, 33, 63, .10);
        }

        .brand-panel {
            grid-column: 1;
            grid-row: 1;
            isolation: isolate;
            position: relative;
            display: flex;
            align-items: end;
            min-height: 620px;
            overflow: hidden;
            padding: clamp(28px, 4vw, 52px);
            border-radius: 20px;
            background: #080e22;
            color: #f7f9ff;
        }

        .brand-cover, .brand-panel::after {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .brand-cover { object-fit: cover; object-position: center 43%; }

        .brand-panel::after {
            content: "";
            background: linear-gradient(0deg, #070b19 2%, rgba(7, 11, 25, .82) 22%, transparent 52%);
        }

        .brand-copy p { margin: 0; }

        .brand-copy .brand-title {
            max-width: 9em;
            margin-bottom: 12px;
            font-size: clamp(30px, 3.4vw, 48px);
            font-weight: 750;
            line-height: 1.2;
            letter-spacing: -.04em;
        }

        .brand-copy .brand-description {
            color: #b6c8e8;
            font-size: 14px;
        }

        .form-panel {
            grid-column: 2;
            grid-row: 1;
            display: grid;
            align-items: center;
            justify-items: center;
            padding: 44px clamp(26px, 4.5vw, 72px);
        }

        .form-inner { width: 100%; max-width: 370px; }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 11px;
            margin: 0 0 28px;
            font-size: 15px;
            font-weight: 700;
        }

        .wordmark-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--action);
            color: var(--action-text);
            font-size: 18px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 3vw, 38px);
            line-height: 1.2;
            letter-spacing: -.045em;
        }

        .intro {
            margin: 9px 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .alert {
            padding: 10px 12px;
            margin: 0 0 16px;
            border: 1px solid currentColor;
            border-radius: 9px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .alert-error { color: var(--error-text); background: var(--error-bg); }
        .alert-success { color: var(--success-text); background: var(--success-bg); }

        form { display: grid; gap: 15px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 650;
        }

        .field-input {
            width: 100%;
            min-width: 0;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            color: var(--text);
        }

        .field-input::placeholder { color: var(--muted); opacity: 1; }

        :is(.field-input, button):focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .password-field { position: relative; }
        .password-field:has(.password-toggle:not([hidden])) .field-input { padding-inline-end: 66px; }

        .password-toggle {
            position: absolute;
            inset: 4px 4px 4px auto;
            min-width: 52px;
            padding: 0 8px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
        }

        .password-toggle:hover { background: var(--soft); }

        .captcha-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(100px, 36%);
            gap: 8px;
        }

        .captcha-refresh {
            display: grid;
            place-items: center;
            min-width: 0;
            min-height: 46px;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--soft);
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
        }

        .captcha-refresh img {
            display: block;
            width: 100%;
            height: 44px;
            object-fit: contain;
            background: #fff;
        }

        .captcha-status {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .submit {
            min-height: 48px;
            margin-top: 3px;
            padding: 10px 16px;
            border: 0;
            border-radius: 9px;
            background: var(--action);
            color: var(--action-text);
            font-weight: 650;
            cursor: pointer;
        }

        .submit:not(:disabled):hover { background: var(--action-hover); }
        button:disabled, button[aria-disabled="true"] { opacity: .67; cursor: default; }

        .return-note {
            margin: 20px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            body { padding: 0; background: var(--surface); }

            .login-layout {
                display: block;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .brand-panel { display: none; }
            .form-panel { padding: 40px 24px; }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #090d17;
                --surface: #131a2a;
                --text: #edf2ff;
                --muted: #abb9d2;
                --border: #64738f;
                --soft: #202c46;
                --accent: #adc1ff;
                --focus: #a1b8ff;
                --action: #abc0ff;
                --action-hover: #c4d2ff;
                --action-text: #101e4d;
                --error-bg: #351c29;
                --error-text: #ffb4b7;
                --success-bg: #153326;
                --success-text: #9be5b5;
            }
        }
    </style>
</head>
<body>
<main class="login-layout">
    <section class="form-panel" aria-labelledby="login-title">
        <div class="form-inner">
            <p class="wordmark"><span class="wordmark-icon" aria-hidden="true">K</span> Kuma UAA</p>
            <h1 id="login-title">登录你的账号</h1>
            <p class="intro">使用 Kuma 账号继续访问你的应用。</p>

            <p class="alert alert-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
            <p class="alert alert-success" role="status" th:if="${logoutMessage}" th:text="${logoutMessage}"></p>

            <form method="post" th:action="@{/login}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label for="username">登录名</label>
                    <input class="field-input" type="text" id="username" name="username" placeholder="请输入登录名"
                           autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
                </div>

                <div>
                    <label for="password">密码</label>
                    <div class="password-field">
                        <input class="field-input" type="password" id="password" name="password" placeholder="请输入密码"
                               autocomplete="current-password" required>
                        <button class="password-toggle" id="passwordToggle" type="button" aria-controls="password"
                                aria-label="显示密码" hidden>显示</button>
                    </div>
                </div>

                <div th:if="${captchaEnabled}">
                    <label for="captchaCode">图形验证码</label>
                    <div class="captcha-row">
                        <input class="field-input" type="text" id="captchaCode" name="captchaCode" placeholder="输入图形中的字符"
                               autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="captchaStatus" required>
                        <button class="captcha-refresh" id="captchaRefresh" type="button" aria-label="刷新图形验证码">
                            <span id="captchaButtonText">刷新</span>
                            <img id="captchaImage" alt="" hidden>
                        </button>
                    </div>
                    <input type="hidden" id="captchaKey" name="captchaKey">
                    <span class="captcha-status" id="captchaStatus" role="status">看不清时，请刷新验证码。</span>
                </div>

                <div th:if="${mfaEnabled}">
                    <label for="totpCode">动态码</label>
                    <input class="field-input" type="text" id="totpCode" name="totpCode" placeholder="6 位动态验证码"
                           autocomplete="one-time-code" inputmode="numeric" maxlength="6">
                </div>

                <button class="submit" id="loginSubmit" type="submit">登录</button>
            </form>

            <p class="return-note">登录后将返回发起授权的应用。</p>
        </div>
    </section>

    <aside class="brand-panel" aria-label="关于 Kuma UAA">
        <img class="brand-cover" th:src="@{/images/uaa-login-cover.webp}" alt="" width="980" height="1225" loading="lazy">
        <div class="brand-copy">
            <p class="brand-title">一个账号，<br>连接所有应用。</p>
            <p class="brand-description">Kuma Framework 统一认证授权中心<br>OAuth 2.1 / OpenID Connect</p>
        </div>
    </aside>
</main>

<script>
    const password = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    passwordToggle.hidden = false;
    passwordToggle.addEventListener('click', () => {
        const showPassword = password.type === 'password';
        password.type = showPassword ? 'text' : 'password';
        passwordToggle.textContent = showPassword ? '隐藏' : '显示';
        passwordToggle.setAttribute('aria-label', showPassword ? '隐藏密码' : '显示密码');
    });
</script>

<script th:if="${captchaEnabled}" th:inline="javascript">
    const captchaUrl = /*[[@{/captcha}]]*/ '/captcha';
    const captchaRefresh = document.getElementById('captchaRefresh');
    const captchaImage = document.getElementById('captchaImage');
    const captchaButtonText = document.getElementById('captchaButtonText');
    const captchaStatus = document.getElementById('captchaStatus');
    const captchaKey = document.getElementById('captchaKey');
    const captchaCode = document.getElementById('captchaCode');
    const loginSubmit = document.getElementById('loginSubmit');

    async function refreshCaptcha() {
        if (captchaRefresh.getAttribute('aria-disabled') === 'true') {
            return;
        }
        captchaRefresh.setAttribute('aria-disabled', 'true');
        loginSubmit.disabled = true;
        captchaImage.hidden = true;
        captchaButtonText.hidden = false;
        captchaButtonText.textContent = '加载中';
        captchaStatus.textContent = '正在加载验证码。';
        captchaKey.value = '';
        captchaCode.value = '';

        try {
            const response = await fetch(captchaUrl, { headers: { Accept: 'application/json' } });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const payload = (await response.json())?.data;
            if (!payload?.image || !payload?.captchaKey) {
                throw new Error('invalid captcha payload');
            }
            captchaImage.src = payload.image;
            await captchaImage.decode();
            captchaImage.hidden = false;
            captchaButtonText.hidden = true;
            captchaStatus.textContent = '验证码已更新，看不清时可再次刷新。';
            captchaCode.value = '';
            captchaKey.value = payload.captchaKey;
            loginSubmit.disabled = false;
        } catch {
            captchaButtonText.textContent = '重试';
            captchaStatus.textContent = '验证码加载失败，请重试。';
        } finally {
            captchaRefresh.removeAttribute('aria-disabled');
        }
    }

    captchaRefresh.addEventListener('click', refreshCaptcha);
    refreshCaptcha();
</script>
</body>
</html>
