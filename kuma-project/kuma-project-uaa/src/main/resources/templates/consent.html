<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Kuma UAA · 授权确认</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
        }

        /* 左侧品牌面板 */
        .brand-panel {
            flex: 1;
            background: linear-gradient(160deg, #1a1f3a 0%, #2d1b4e 55%, #0f2847 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 56px;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120, 90, 255, .35), transparent 70%);
            top: -150px;
            right: -150px;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 255, .25), transparent 70%);
            bottom: -120px;
            left: -100px;
        }

        .brand-top { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }

        .brand-top .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7a5cff, #00c2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-top span { font-size: 17px; font-weight: 600; letter-spacing: .5px; }

        .brand-mid { position: relative; z-index: 1; }

        .brand-mid h2 {
            font-size: 34px;
            line-height: 1.4;
            font-weight: 650;
            letter-spacing: .5px;
        }

        .brand-mid p {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(255, 255, 255, .6);
            line-height: 1.9;
            max-width: 380px;
        }

        .brand-bottom {
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
        }

        /* 右侧表单面板 */
        .form-panel {
            width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 48px;
            color: #111;
        }

        .form-inner { width: 100%; max-width: 380px; }

        .form-inner h1 { font-size: 24px; font-weight: 650; }

        .subtitle {
            margin: 10px 0 26px;
            font-size: 13px;
            color: #888;
            line-height: 1.8;
        }

        .subtitle strong { color: #111; }

        .scope {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #fafafa;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
        }

        .scope:hover { border-color: #c9c2ff; }

        .scope:has(input:checked) {
            border-color: #6d5cff;
            box-shadow: 0 0 0 3px rgba(109, 92, 255, .08);
            background: #fbfaff;
        }

        .scope input { width: 16px; height: 16px; accent-color: #6d5cff; }

        .scope span.code {
            margin-left: auto;
            font-size: 12px;
            color: #999;
        }

        .approved { opacity: .55; cursor: default; }
        .approved:hover { border-color: #e2e2e2; }
        .approved:has(input:checked) { box-shadow: none; background: #fafafa; border-color: #e2e2e2; }

        .actions { display: flex; gap: 12px; margin-top: 26px; }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow .2s, transform .15s, background .15s;
        }

        .primary {
            background: linear-gradient(135deg, #6d5cff, #00c2ff);
            color: #fff;
            box-shadow: 0 8px 20px rgba(109, 92, 255, .3);
        }

        .primary:hover { box-shadow: 0 10px 28px rgba(109, 92, 255, .45); transform: translateY(-1px); }

        .secondary {
            background: #f1f1f4;
            color: #333;
        }

        .secondary:hover { background: #e7e7ec; }

        @media (max-width: 860px) {
            .brand-panel { display: none; }
            .form-panel { width: 100%; min-height: 100vh; }
        }
    </style>
</head>
<body>
<div class="brand-panel">
    <div class="brand-top">
        <div class="logo">K</div>
        <span>Kuma Framework</span>
    </div>
    <div class="brand-mid">
        <h2>一个账号，<br>连接所有应用。</h2>
        <p>Kuma UAA 为你的微服务生态提供统一的身份认证与授权能力，基于 OAuth 2.1 / OpenID Connect 标准协议。</p>
    </div>
    <div class="brand-bottom">© 2026 Kuma Framework · 统一认证授权中心</div>
</div>

<div class="form-panel">
    <div class="form-inner">
        <h1>授权确认</h1>
        <p class="subtitle">
            应用 <strong th:text="${clientName}">应用</strong> 请求访问你的
            <strong th:text="${principalName}">账号</strong>，
            请确认允许其获取以下权限。
        </p>

        <form method="post" th:action="@{/oauth2/authorize}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" name="user_code" th:if="${userCode}" th:value="${userCode}">

            <label class="scope" th:each="scope : ${scopes}">
                <input type="checkbox" name="scope" th:value="${scope}" checked>
                <span th:text="${scope}">scope</span>
            </label>

            <label class="scope approved" th:each="scope : ${previouslyApprovedScopes}">
                <input type="checkbox" checked disabled>
                <span th:text="${scope}">scope</span>
                <span class="code">已授权</span>
            </label>

            <div class="actions">
                <button type="submit" class="primary">同意授权</button>
                <button type="submit" class="secondary" formnovalidate
                        th:formaction="@{/oauth2/authorize}" name="scope" value="">拒绝</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
