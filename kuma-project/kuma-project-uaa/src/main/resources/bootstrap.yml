spring:
  application:
    name: kuma-cloud-uaa
  profiles:
    active: dev
  config:
    import:
      - "optional:nacos:kuma-shared-dev.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:kuma-cloud-uaa-dev.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      username: nacos
      password: 123456
      server-addr: 172.23.89.45:8848
      discovery:
        enabled: true
        register-enabled: true
        namespace: base
        server-addr: 172.23.89.45:8848
      config:
        enabled: true
        namespace: base
        server-addr: 172.23.89.45:8848
        file-extension: yaml
        group: DEFAULT_GROUP
