description = '''KumaFramework project参考 —— 当前启用的渐进式 Demo 应用，演示框架各能力的用法：
  project2 : 最简骨架，无任何依赖，仅验证项目能否正常启动
  project4 : 全量 Demo，涵盖 kuma-boot-framework 全部 starter（安全 / 双数据源 MySQL+PostgreSQL / Redis+Caffeine+JetCache / Kafka / 分布式锁 / IP归属 / Office导出 / 验证码 / TOTP / 钉钉 / Sentinel）及 kuma-cloud-framework 各 starter
  blog     : 博客系统 Demo，完整业务场景，含 Spring Security OAuth2 / MySQL / Redis / MyBatis / SpringDoc
  uaa      : Kuma 体系统一认证授权中心（OAuth2.1 + OIDC 授权服务器），为 blog 等业务应用签发 JWT，含用户/角色/权限/客户端管理、图形验证码、TOTP 二次校验、登录锁定
  gateway  : Kuma 体系统一网关（Spring Cloud Gateway / WebFlux），统一流量入口；集成框架 Prometheus/Logger/IP2region/Actuator 能力
  lab      : 测试实验场，用于集中记录事务、缓存、消息队列、锁、LeetCode 算法练习等各类验证代码

  未启用的 Demo 见 kuma-project-unable 模块。
'''
