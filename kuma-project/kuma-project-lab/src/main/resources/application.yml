server:
  port: 9090
  servlet:
    context-path: /api

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

spring:
  profiles:
    active: ${active}
  application:
    name: kuma-cloud-lab
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          type: com.zaxxer.hikari.HikariDataSource
          url: ${mysql_url}
          username: ${mysql_username}
          password: ${mysql_password}
          driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

kuma:
  lab:
    mysql-binlog:
      # Explicit opt-in: the configured user must have MySQL replication privileges.
      enabled: false
      jdbc-url: ${mysql_url}
      username: ${mysql_username}
      password: ${mysql_password}
      server-id: 184054
      topic-prefix: kuma-lab-mysql
      table-include-list: base.tx_demo_account
      snapshot-mode: no_data
      offset-file: data/lab-binlog/offsets.dat
      schema-history-file: data/lab-binlog/schema-history.dat
      buffer-capacity: 1000
  boot:
    security:
      ignore-url:
        - /lab/**
      oauth2:
        endpoint:
          uaa-service-uri: http://127.0.0.1:33336
    web:
      graceful-response:
        response-style: 0
    data:
      datasource:
        enabled: true
    springdoc:
      enabled: true
      type: SERVICE
      title: Kuma Test Lab API
      description: KumaFramework 测试实验项目接口文档
      version: 1.0.0
      packages-to-scan:
        - com.kuma.cloud.lab
