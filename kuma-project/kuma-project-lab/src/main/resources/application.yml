server:
  port: 9090
  servlet:
    context-path: /api

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

spring:
  profiles:
    active: ${active}
  application:
    name: kuma-cloud-lab
  autoconfigure:
    exclude:
      # 框架通过 @EnableKnife4j 装配定制版 Knife4jAutoConfiguration，排除官方自动装配避免 Bean 冲突
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          type: com.zaxxer.hikari.HikariDataSource
          url: ${mysql_url}
          username: ${mysql_username}
          password: ${mysql_password}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${redis_host}
      port: ${redis_port}
      database: ${redis_database}
      password: ${redis_password}
      jedis:
        pool:
          max-active: ${redis_jedis_pool_max_active}
          max-idle: ${redis_jedis_pool_max_idle}
          min-idle: ${redis_jedis_pool_min_idle}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

kuma:
  lab:
    redis:
      key-prefix: "lab:redis:"
    mysql-binlog:
      # Explicit opt-in: the configured user must have MySQL replication privileges.
      enabled: false
      jdbc-url: ${mysql_url}
      username: ${mysql_username}
      password: ${mysql_password}
      server-id: 184054
      topic-prefix: kuma-lab-mysql
      table-include-list: base.tx_demo_account
      snapshot-mode: no_data
      offset-file: data/lab-binlog/offsets.dat
      schema-history-file: data/lab-binlog/schema-history.dat
      buffer-capacity: 1000
    kafka:
      # Explicit opt-in: requires a reachable Kafka cluster and the test topic.
      enabled: true
      bootstrap-servers: ${kafka_bootstrap_servers}
      topic: kuma-lab-test
      group-id: kuma-lab-test-group
      buffer-capacity: 1000
    jni:
      enabled: true
      library-name: "lab_math"
  boot:
    security:
      ignore-url:
        - /lab/**
      oauth2:
        endpoint:
          uaa-service-uri: http://127.0.0.1:33336
    web:
      graceful-response:
        response-style: 0
    data:
      datasource:
        enabled: true
    springdoc:
      enabled: true
      type: SERVICE
      title: Kuma Test Lab API
      description: KumaFramework 测试实验项目接口文档
      version: 1.0.0
      packages-to-scan:
        - com.kuma.cloud.lab
