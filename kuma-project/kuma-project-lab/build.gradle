plugins {
    alias(projectLibs.plugins.springboot)
    alias(projectLibs.plugins.spring.dependency.management)
}

import org.gradle.internal.os.OperatingSystem

description = 'KumaFramework 测试实验场 —— 集中记录事务、缓存、消息队列、锁等各类验证代码'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${projectLibs.versions.springboot.get()}"
    }
}

dependencies {
    api project(':kuma-boot-framework:kuma-boot-starter-common')
    api project(':kuma-boot-framework:kuma-boot-starter-core')
    api project(':kuma-boot-framework:kuma-boot-starter-web')
    api project(':kuma-boot-framework:kuma-boot-starter-data-datasource')
    api project(':kuma-boot-framework:kuma-boot-starter-cache-redis')
    api project(':kuma-boot-framework:kuma-boot-starter-data-vector')
    api project(':kuma-boot-framework:kuma-boot-starter-springdoc')
    api(project(':kuma-cloud-framework:kuma-cloud-starter-bootstrap')) {
        exclude group: 'org.springframework.cloud', module: 'spring-cloud-starter-loadbalancer'
    }
    api project(':kuma-cloud-framework:kuma-cloud-starter-alibaba')

    api projectLibs.spring.boot.starter.web
    api projectLibs.spring.doc.webmvc

    implementation platform('io.debezium:debezium-bom:3.4.3.Final')
    implementation 'io.debezium:debezium-api'
    implementation 'io.debezium:debezium-embedded'
    implementation 'io.debezium:debezium-connector-mysql'
    implementation projectLibs.spring.boot.starter.kafka

    testImplementation projectLibs.spring.boot.starter.test
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly projectLibs.lombok
    annotationProcessor projectLibs.lombok

    runtimeOnly projectLibs.mysql
    runtimeOnly projectLibs.postgresql

    implementation 'org.openjdk.jol:jol-core:0.17'
    // Use the Boot BOM for the entire SDK/exporter family; catalog 1.37 mixed with
    // Boot-managed exporter internals causes NoSuchMethodError during OTLP export.
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation projectLibs.skywalking.apm.toolkit.trace
}

bootJar {
    archiveBaseName = 'lab'
}

springBoot {
    mainClass = 'com.kuma.cloud.lab.LabApplication'
}

def nativeOutputDir = layout.buildDirectory.dir('native')
def nativeToolsDir = layout.buildDirectory.dir('tools')
def nativeSourceFile = file('src/main/c/lab_math.c')
def nativeLibBaseName = 'lab_math'
def nativeLibFileName = OperatingSystem.current().isWindows() ? "${nativeLibBaseName}.dll"
        : OperatingSystem.current().isMacOsX() ? "lib${nativeLibBaseName}.dylib"
        : "lib${nativeLibBaseName}.so"
def portableTccDir = nativeToolsDir.map { it.dir('tcc') }
def portableTccExe = portableTccDir.map { it.file('tcc/tcc.exe') }
def portableTccZip = nativeToolsDir.map { it.file('tcc-win64.zip') }

def isGccAvailable = {
    try {
        def process = ['gcc', '--version'].execute()
        process.waitFor()
        return process.exitValue() == 0
    } catch (Exception ignored) {
        return false
    }
}

tasks.register('downloadPortableTcc') {
    group = 'build'
    description = 'Download portable TinyCC for Windows when system gcc is unavailable'
    onlyIf {
        OperatingSystem.current().isWindows()
                && !isGccAvailable()
                && !portableTccExe.get().asFile.exists()
    }

    doLast {
        def zipFile = portableTccZip.get().asFile
        zipFile.parentFile.mkdirs()
        def zipUrl = 'https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip'
        new URI(zipUrl).toURL().withInputStream { input ->
            zipFile.withOutputStream { output -> output << input }
        }
        copy {
            from zipTree(zipFile)
            into portableTccDir.get().asFile
        }
    }
}

def resolveNativeCompiler = {
    if (!OperatingSystem.current().isWindows()) {
        return ['gcc']
    }
    if (isGccAvailable()) {
        return ['gcc']
    }
    def tcc = portableTccExe.get().asFile
    if (tcc.exists()) {
        return [tcc.absolutePath]
    }
    return ['gcc']
}

tasks.register('compileNative', Exec) {
    group = 'build'
    description = 'Compile JNI C library for the current platform'

    dependsOn tasks.named('downloadPortableTcc')

    def outputFile = nativeOutputDir.get().file(nativeLibFileName).asFile
    outputs.file(outputFile)
    inputs.file(nativeSourceFile)

    def javaHome = org.gradle.internal.jvm.Jvm.current().javaHome.absolutePath
    def includeDir = "${javaHome}/include"
    def sourcePath = nativeSourceFile.absolutePath

    doFirst {
        outputFile.parentFile.mkdirs()
        def compiler = resolveNativeCompiler()[0]
        if (OperatingSystem.current().isWindows()) {
            commandLine compiler, '-shared',
                    "-I${includeDir}", "-I${includeDir}/win32",
                    sourcePath, '-o', outputFile.absolutePath
        } else if (OperatingSystem.current().isMacOsX()) {
            commandLine compiler, '-shared', '-fPIC',
                    "-I${includeDir}", "-I${includeDir}/darwin",
                    sourcePath, '-o', outputFile.absolutePath
        } else {
            commandLine compiler, '-shared', '-fPIC',
                    "-I${includeDir}", "-I${includeDir}/linux",
                    sourcePath, '-o', outputFile.absolutePath
        }
    }
}

classes.dependsOn tasks.named('compileNative')

processResources {
    dependsOn tasks.named('compileNative')
    from(nativeOutputDir) {
        into 'native'
    }
}

bootRun {
    dependsOn tasks.named('compileNative')
    systemProperty 'java.library.path', nativeOutputDir.get().asFile.absolutePath
}

test {
    useJUnitPlatform()
    inputs.property('observabilityDatabaseIntegrationEnabled',
            providers.environmentVariable('KUMA_LAB_OBSERVABILITY_JDBC_URL').map { true }.orElse(false))
    // Live DB checks must run again when selecting another server/engine.
    outputs.upToDateWhen { !providers.environmentVariable('KUMA_LAB_OBSERVABILITY_JDBC_URL').isPresent() }
}

tasks.register('otelLab', JavaExec) {
    group = 'application'
    description = 'Run OTel SDK lessons; -PotelExport=true also verifies the trace in SkyWalking'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kuma.cloud.lab.observability.OtelLearningDemo'
    if (providers.gradleProperty('otelExport').getOrElse('false').toBoolean()) {
        args '--export', providers.gradleProperty('otelEndpoint').getOrElse('http://localhost:4318/v1/traces'),
                providers.gradleProperty('skywalkingQuery').getOrElse('http://localhost:9412')
    }
}

tasks.register('monitoringLab', JavaExec) {
    group = 'application'
    description = 'Run live Loki/Prometheus/Alertmanager/OTel/SkyWalking/Grafana experiments'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kuma.cloud.lab.observability.MonitoringMiddlewareLabs'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    args providers.gradleProperty('monitoringComponent').getOrElse('all')
}

tasks.register('skywalkingLab', JavaExec) {
    group = 'application'
    description = 'Run SkyWalking toolkit lessons; -PskywalkingAgent=<jar> enables native instrumentation'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kuma.cloud.lab.observability.SkyWalkingLearningDemo'
    doFirst {
        if (providers.gradleProperty('skywalkingAgent').isPresent()) {
            def agent = file(providers.gradleProperty('skywalkingAgent').get())
            if (!agent.isFile()) throw new GradleException("SkyWalking agent not found: ${agent}")
            jvmArgs "-javaagent:${agent.absolutePath}",
                    '-Dskywalking.agent.service_name=kuma-lab-skywalking',
                    '-Dskywalking.agent.sample_n_per_3_secs=-1',
                    '-Dskywalking.agent.keep_tracing=true',
                    "-Dskywalking.collector.backend_service=${providers.gradleProperty('skywalkingBackend').getOrElse('localhost:11800')}"
            args '--require-agent'
        }
    }
}

tasks.register('otelDatabaseLab', JavaExec) {
    group = 'application'
    description = 'Run real isolated JDBC transactions with OTel; connection credentials come from environment'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kuma.cloud.lab.observability.DatabaseObservabilityLearningDemo'
    if (providers.gradleProperty('otelExport').getOrElse('false').toBoolean()) {
        args '--export', providers.gradleProperty('otelEndpoint').getOrElse('http://localhost:4318/v1/traces'),
                providers.gradleProperty('skywalkingQuery').getOrElse('http://localhost:9412')
    }
}

tasks.register('skywalkingDatabaseLab', JavaExec) {
    group = 'application'
    description = 'Run real JDBC transactions under the SkyWalking Agent'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kuma.cloud.lab.observability.DatabaseObservabilityLearningDemo'
    args '--native'
    doFirst {
        def agentPath = providers.gradleProperty('skywalkingAgent')
        if (!agentPath.isPresent()) throw new GradleException('Specify -PskywalkingAgent=<full agent jar path>')
        def agent = file(agentPath.get())
        if (!agent.isFile()) throw new GradleException("SkyWalking agent not found: ${agent}")
        jvmArgs "-javaagent:${agent.absolutePath}",
                '-Dskywalking.agent.service_name=kuma-lab-database-native',
                '-Dskywalking.agent.sample_n_per_3_secs=-1',
                '-Dskywalking.agent.keep_tracing=true',
                "-Dskywalking.collector.backend_service=${providers.gradleProperty('skywalkingBackend').getOrElse('localhost:11800')}"
    }
}
