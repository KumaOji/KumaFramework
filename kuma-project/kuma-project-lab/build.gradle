plugins {
    alias(projectLibs.plugins.springboot)
    alias(projectLibs.plugins.spring.dependency.management)
}

import org.gradle.internal.os.OperatingSystem

description = 'KumaFramework 测试实验场 —— 集中记录事务、缓存、消息队列、锁等各类验证代码'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${projectLibs.versions.springboot.get()}"
    }
}

dependencies {
    api project(':kuma-boot-framework:kuma-boot-starter-common')
    api project(':kuma-boot-framework:kuma-boot-starter-core')
    api project(':kuma-boot-framework:kuma-boot-starter-web')
    api project(':kuma-boot-framework:kuma-boot-starter-data-datasource')
    api project(':kuma-boot-framework:kuma-boot-starter-cache-redis')
    api project(':kuma-boot-framework:kuma-boot-starter-springdoc')

    api projectLibs.spring.boot.starter.web
    api projectLibs.spring.doc.webmvc

    implementation platform('io.debezium:debezium-bom:3.4.3.Final')
    implementation 'io.debezium:debezium-api'
    implementation 'io.debezium:debezium-embedded'
    implementation 'io.debezium:debezium-connector-mysql'
    implementation projectLibs.spring.boot.starter.kafka

    compileOnly projectLibs.lombok
    annotationProcessor projectLibs.lombok

    runtimeOnly projectLibs.mysql
}

def labMysqlUrl               = project.findProperty('mysql.url')                  ?: ''
def labMysqlUsername          = project.findProperty('mysql.username')             ?: ''
def labMysqlPassword          = project.findProperty('mysql.password')             ?: ''
def labKafkaBootstrapServers  = project.findProperty('kafka.bootstrap-servers')    ?: 'localhost:9092'
def labRedisHost              = project.findProperty('redis.host')                 ?: ''
def labRedisPort              = project.findProperty('redis.port')                 ?: ''
def labRedisDatabase          = project.findProperty('redis.database')             ?: ''
def labRedisPassword          = project.findProperty('redis.password')             ?: ''
def labRedisJedisPoolMaxActive = project.findProperty('redis.jedis.pool.max-active') ?: ''
def labRedisJedisPoolMaxIdle   = project.findProperty('redis.jedis.pool.max-idle')   ?: ''
def labRedisJedisPoolMinIdle   = project.findProperty('redis.jedis.pool.min-idle')   ?: ''

bootJar {
    archiveBaseName = 'lab'
}

def nativeOutputDir = layout.buildDirectory.dir('native')
def nativeToolsDir = layout.buildDirectory.dir('tools')
def nativeSourceFile = file('src/main/c/lab_math.c')
def nativeLibBaseName = 'lab_math'
def nativeLibFileName = OperatingSystem.current().isWindows() ? "${nativeLibBaseName}.dll"
        : OperatingSystem.current().isMacOsX() ? "lib${nativeLibBaseName}.dylib"
        : "lib${nativeLibBaseName}.so"
def portableTccDir = nativeToolsDir.map { it.dir('tcc') }
def portableTccExe = portableTccDir.map { it.file('tcc/tcc.exe') }
def portableTccZip = nativeToolsDir.map { it.file('tcc-win64.zip') }

tasks.register('downloadPortableTcc') {
    group = 'build'
    description = 'Download portable TinyCC for Windows when system gcc is unavailable'
    onlyIf {
        OperatingSystem.current().isWindows() && !portableTccExe.get().asFile.exists()
    }

    doLast {
        def zipFile = portableTccZip.get().asFile
        zipFile.parentFile.mkdirs()
        def zipUrl = 'https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win64-bin.zip'
        new URI(zipUrl).toURL().withInputStream { input ->
            zipFile.withOutputStream { output -> output << input }
        }
        copy {
            from zipTree(zipFile)
            into portableTccDir.get().asFile
        }
    }
}

def resolveNativeCompiler = {
    if (!OperatingSystem.current().isWindows()) {
        return ['gcc']
    }
    def tcc = portableTccExe.get().asFile
    if (tcc.exists()) {
        return [tcc.absolutePath]
    }
    return ['gcc']
}

tasks.register('compileNative', Exec) {
    group = 'build'
    description = 'Compile JNI C library for the current platform'

    dependsOn tasks.named('downloadPortableTcc')

    def outputFile = nativeOutputDir.get().file(nativeLibFileName).asFile
    outputs.file(outputFile)
    inputs.file(nativeSourceFile)

    def javaHome = org.gradle.internal.jvm.Jvm.current().javaHome.absolutePath
    def includeDir = "${javaHome}/include"
    def sourcePath = nativeSourceFile.absolutePath

    doFirst {
        outputFile.parentFile.mkdirs()
        def compiler = resolveNativeCompiler()[0]
        if (OperatingSystem.current().isWindows()) {
            commandLine compiler, '-shared',
                    "-I${includeDir}", "-I${includeDir}/win32",
                    sourcePath, '-o', outputFile.absolutePath
        } else if (OperatingSystem.current().isMacOsX()) {
            commandLine compiler, '-shared', '-fPIC',
                    "-I${includeDir}", "-I${includeDir}/darwin",
                    sourcePath, '-o', outputFile.absolutePath
        } else {
            commandLine compiler, '-shared', '-fPIC',
                    "-I${includeDir}", "-I${includeDir}/linux",
                    sourcePath, '-o', outputFile.absolutePath
        }
    }
}

classes.dependsOn tasks.named('compileNative')

processResources {
    dependsOn tasks.named('compileNative')
    filesMatching('**/application.yml') {
        expand(
                active                     : 'dev',
                mysql_url                  : labMysqlUrl,
                mysql_username             : labMysqlUsername,
                mysql_password             : labMysqlPassword,
                kafka_bootstrap_servers    : labKafkaBootstrapServers,
                redis_host                 : labRedisHost,
                redis_port                 : labRedisPort,
                redis_database             : labRedisDatabase,
                redis_password             : labRedisPassword,
                redis_jedis_pool_max_active: labRedisJedisPoolMaxActive,
                redis_jedis_pool_max_idle  : labRedisJedisPoolMaxIdle,
                redis_jedis_pool_min_idle  : labRedisJedisPoolMinIdle
        )
    }
    from(nativeOutputDir) {
        into 'native'
    }
}

bootRun {
    dependsOn tasks.named('compileNative')
    systemProperty 'java.library.path', nativeOutputDir.get().asFile.absolutePath
}
