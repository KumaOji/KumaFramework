plugins {
    alias(projectLibs.plugins.springboot)
    alias(projectLibs.plugins.spring.dependency.management)
}

description = '标准业务项目模板：常规分层、Nacos、多数据源、MyBatis 与线程池'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${projectLibs.versions.springboot.get()}"
    }
}

dependencies {
    implementation project(':kuma-boot-framework:kuma-boot-starter-core')
    implementation project(':kuma-boot-framework:kuma-boot-starter-logger')
    implementation project(':kuma-boot-framework:kuma-boot-starter-web')
    implementation project(':kuma-boot-framework:kuma-boot-starter-data-datasource')
    implementation project(':kuma-boot-framework:kuma-boot-starter-data-migration')
    implementation project(':kuma-cloud-framework:kuma-cloud-starter-alibaba')
    implementation project(':kuma-boot-framework:kuma-boot-starter-data-mybatis')
    implementation project(':kuma-boot-framework:kuma-boot-starter-actuator')
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot { mainClass = 'com.kuma.cloud.reference.ReferenceApplication' }
bootJar { archiveFileName = 'kuma-reference.jar' }
tasks.withType(Test).configureEach {
    // Tests use isolated classpath fixtures, never the developer's Nacos configuration.
    systemProperty 'spring.cloud.nacos.config.enabled', 'false'
    systemProperty 'spring.cloud.nacos.discovery.enabled', 'false'
    systemProperty 'spring.cloud.nacos.config.import-check.enabled', 'false'
}
tasks.named('test') { useJUnitPlatform() }

tasks.register('wslTest', Test) {
    description = 'Verify real WSL PostgreSQL schema routing with the MySQL datasource available'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'wsl' }
    shouldRunAfter tasks.named('test')
}
tasks.named('test') { useJUnitPlatform { excludeTags 'wsl' } }
