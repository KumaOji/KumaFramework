plugins {
    alias(projectLibs.plugins.springboot)
    alias(projectLibs.plugins.spring.dependency.management)
}

description = '标准业务项目模板：常规分层、Nacos、双数据源、MyBatis、线程池与 HTTP 连接池'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${projectLibs.versions.springboot.get()}"
    }
}

dependencies {
    implementation project(':kuma-cloud-framework:kuma-cloud-starter-alibaba')
    implementation(project(':kuma-boot-framework:kuma-boot-starter-data-mybatis')) {
        exclude group: 'com.alibaba', module: 'druid-spring-boot-4-starter'
        exclude group: 'com.mysql', module: 'mysql-connector-j'
        // Kuma 组件提供 MyBatis-Plus，由其创建唯一的 SqlSessionFactory。
        exclude group: 'org.mybatis.spring.boot', module: 'mybatis-spring-boot-starter'
    }
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot { mainClass = 'com.kuma.cloud.reference.ReferenceApplication' }
bootJar { archiveFileName = 'kuma-reference.jar' }
tasks.withType(Test).configureEach {
    // Tests use isolated classpath fixtures, never the developer's Nacos configuration.
    systemProperty 'spring.cloud.nacos.config.enabled', 'false'
    systemProperty 'spring.cloud.nacos.discovery.enabled', 'false'
    systemProperty 'spring.cloud.nacos.config.import-check.enabled', 'false'
}
tasks.named('test') { useJUnitPlatform() }

tasks.register('wslTest', Test) {
    description = 'Verify real PostgreSQL schema routing against the isolated WSL reference schemas'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'wsl' }
    shouldRunAfter tasks.named('test')
}
tasks.named('test') { useJUnitPlatform { excludeTags 'wsl' } }
