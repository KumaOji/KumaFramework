server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:19092}
  shutdown: graceful
  tomcat:
    threads:
      max: 100
      min-spare: 10
    max-connections: 200
    accept-count: 50
    connection-timeout: 5s

spring:
  autoconfigure:
    exclude:
      # MyBatis 组件传递了缓存依赖；此订单示例不启用 Redis 客户端。
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  application:
    name: kuma-reference
  profiles:
    default: wsl
  main:
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 25s
  mvc:
    async:
      request-timeout: 5s
  datasource:
    dynamic:
      primary: referenceMain
      strict: true
      grace-destroy: true
      hikari:
        max-pool-size: ${DB_POOL_MAX:5}
        min-idle: ${DB_POOL_MIN:1}
        connection-timeout: 3000
        validation-timeout: 1000
        idle-timeout: 600000
        max-lifetime: 1800000
        keepalive-time: 120000
  jdbc:
    template:
      query-timeout: 2s
  transaction:
    default-timeout: 3s
  liquibase:
    enabled: false
  flyway:
    # 每个物理池由 SchemaDataSourceConfiguration 分别迁移。
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 2
    default-executor-type: SIMPLE
    local-cache-scope: STATEMENT

kuma:
  boot:
    web:
      error:
        handling:
          enabled: true
          search-super-class-hierarchy: true
          http-statuses:
            java.lang.IllegalArgumentException: BAD_REQUEST
            org.springframework.dao.DataAccessException: SERVICE_UNAVAILABLE
            org.springframework.core.task.TaskRejectedException: SERVICE_UNAVAILABLE
          messages:
            java.lang.IllegalArgumentException: 请求不符合业务约束
            java.lang.Exception: 服务内部错误
    core:
      async:
        enabled: true
        virtual-threads: false
        thread-name-prefix: reference-business-
        core-pool-size: ${BUSINESS_THREADS_CORE:4}
        max-pool-siz: ${BUSINESS_THREADS_MAX:8}
        queue-capacity: ${BUSINESS_QUEUE_CAPACITY:100}
        keep-alive-seconds: 60
        allow-core-thread-time-out: true
        rejection-policy: ABORT
        wait-for-tasks-to-complete-on-shutdown: true
        await-termination-seconds: 20
        strict-early-shutdown: true
        enable-servlet-async-context: false
    data:
      migration:
        enabled: true
        type: FLYWAY
      mybatis:
        enabled: true
        mybatis-plus:
          enabled: true
          auto-fill:
            # 订单的 ID、版本和创建时间由领域模型生成。
            enabled: false
          interceptor:
            enabled: true
            block-attack:
              enabled: true
            multi-tenant:
              enabled: true
              multi-tenant-type: SCHEMA
              tenant-database-prefix: kuma_reference
              db-type: POSTGRE_SQL
    cache:
      jetcache:
        enabled: false


management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
