# 仅用于没有 WSL 的离线演示；默认启动使用 wsl profile。
spring:
  datasource:
    dynamic:
      datasource:
        referenceMain:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.h2.Driver
          url: 'jdbc:h2:mem:reference-main;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS kuma_reference_main\;SET SCHEMA kuma_reference_main'
          username: sa
          password: ''
        referenceSandbox:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.h2.Driver
          url: 'jdbc:h2:mem:reference-sandbox;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS kuma_reference_sandbox\;SET SCHEMA kuma_reference_sandbox'
          username: sa
          password: ''
