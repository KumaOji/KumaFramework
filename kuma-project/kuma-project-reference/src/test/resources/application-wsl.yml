spring:
  datasource:
    dynamic:
      datasource:
        referenceMain:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${REFERENCE_PG_HOST}:${REFERENCE_PG_PORT:5432}/${REFERENCE_PG_DATABASE:base}?currentSchema=kuma_reference_main&connectTimeout=3&socketTimeout=5&ApplicationName=kuma-reference-main
          username: ${REFERENCE_PG_USERNAME}
          password: ${REFERENCE_PG_PASSWORD}
        referenceSandbox:
          type: com.zaxxer.hikari.HikariDataSource
          driver-class-name: org.postgresql.Driver
          url: jdbc:postgresql://${REFERENCE_PG_HOST}:${REFERENCE_PG_PORT:5432}/${REFERENCE_PG_DATABASE:base}?currentSchema=kuma_reference_sandbox&connectTimeout=3&socketTimeout=5&ApplicationName=kuma-reference-sandbox
          username: ${REFERENCE_PG_USERNAME}
          password: ${REFERENCE_PG_PASSWORD}
