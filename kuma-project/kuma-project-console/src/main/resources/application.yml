server:
  address: 127.0.0.1
  port: ${KUMA_CONSOLE_PORT:18090}
spring:
  application:
    name: kuma-local-console
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 3
console:
  panels:
    grafana-url: ${KUMA_GRAFANA_URL:http://localhost:3000/}
  life:
    directory: ${KUMA_LIFE_DIR:D:/Vscode_project/life}
    distribution: ${KUMA_LIFE_DISTRIBUTION:Ubuntu-24.04}
    qinglong-port: ${KUMA_LIFE_QINGLONG_PORT:5700}
    rsshub-port: ${KUMA_LIFE_RSSHUB_PORT:1200}
  dsh:
    directory: ${KUMA_DSH_DIR:D:/Vscode_project/deepseek-harness}
    port: ${KUMA_DSH_PORT:3080}
  components:
    distribution: ${KUMA_COMPONENTS_DISTRIBUTION:Ubuntu-24.04}
  blog:
    directory: ${KUMA_BLOG_FRONTEND_DIR:}
    port: ${KUMA_BLOG_FRONTEND_PORT:4321}
  workspace: ${KUMA_CONSOLE_WORKSPACE:}
  remote:
    target: ${KUMA_REMOTE_TARGET:root@117.72.13.197}
    key: ${KUMA_REMOTE_KEY:C:/Users/Kuma/Desktop/server/Kumakey.pem}
  open-browser: ${KUMA_CONSOLE_OPEN_BROWSER:true}
  wsl-distribution: ${KUMA_CONSOLE_WSL_DISTRIBUTION:auto}
  wsl-user: ${KUMA_CONSOLE_WSL_USER:root}
  projects:
    - name: Blog
      url: ${KUMA_BLOG_URL:http://127.0.0.1:9000/api}
    - name: Lab
      url: ${KUMA_LAB_URL:http://127.0.0.1:19090/api}
    - name: UAA
      url: ${KUMA_UAA_URL:http://127.0.0.1:33336}
    - name: Gateway
      url: ${KUMA_GATEWAY_URL:http://127.0.0.1:18080}
      management-url: ${KUMA_GATEWAY_MANAGEMENT_URL:http://127.0.0.1:18081}
