server:
  address: 127.0.0.1
  port: ${KUMA_CONSOLE_PORT:18090}
spring:
  application:
    name: kuma-local-console
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 3
console:
  open-browser: ${KUMA_CONSOLE_OPEN_BROWSER:true}
  wsl-distribution: ${KUMA_CONSOLE_WSL_DISTRIBUTION:auto}
  wsl-user: ${KUMA_CONSOLE_WSL_USER:root}
  projects:
    - name: Blog
      url: ${KUMA_BLOG_URL:http://127.0.0.1:9000/api}
    - name: Lab
      url: ${KUMA_LAB_URL:http://127.0.0.1:9090/api}
    - name: UAA
      url: ${KUMA_UAA_URL:http://127.0.0.1:33336}
    - name: Gateway
      url: ${KUMA_GATEWAY_URL:http://127.0.0.1:18080}
