server:
  port: 9000
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        path: /
  tomcat:
    threads:
      max: 400
      min-spare: 20
    accept-count: 200
    connection-timeout: 20000

spring:
  autoconfigure:
    exclude:
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          blog:
            provider: blog-uaa
            client-id: ${BLOG_OAUTH2_CLIENT_ID}
            client-secret: ${BLOG_OAUTH2_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - offline_access
        provider:
          blog-uaa:
            authorization-uri: ${BLOG_OAUTH2_AUTHORIZATION_URI}
            token-uri: ${BLOG_OAUTH2_TOKEN_URI}
            jwk-set-uri: ${BLOG_OAUTH2_JWK_SET_URI}
            user-info-uri: ${BLOG_OAUTH2_USER_INFO_URI}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${BLOG_OAUTH2_JWK_SET_URI}
  mvc:
    async:
      request-timeout: 600000
  main:
    lazy-initialization: false
    log-startup-info: true
  cache:
    type: redis
    redis:
      time-to-live: 12h
    cache-names:
      - jwt
  sql:
    init:
      mode: never
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          hikari:
            minimum-idle: 5
            maximum-pool-size: 30
            connection-timeout: 10000
            idle-timeout: 600000
            max-lifetime: 1800000

logging:
  config: classpath:logback-observability.xml
  level:
    root: INFO

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

knife4j:
  enable: false

blog:
  token-expire-seconds: 604800
  cookie-secure: true
  oauth2:
    registration-id: blog
    username-claim: preferred_username
    issuer-uri: ${BLOG_OAUTH2_ISSUER_URI}
    audience: ${BLOG_OAUTH2_AUDIENCE:blog}
    login-success-url: ${BLOG_LOGIN_SUCCESS_URL}
    refresh-token-max-age: 30d
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD}
  music:
    base-path: /data/music

jetcache:
  stat-interval-minutes: 15
  local:
    default:
      type: linkedhashmap
      keyConvertor: fastjson2
      limit: 2000

kuma:
  boot:
    audit-log:
      enabled: true
      async: false
    ai:
      base-url: ${AI_CHAT_BASE_URL}
      api-key: ${AI_CHAT_API_KEY}
      model: ${AI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        base-url: http://ollama.base:11434/v1
        model: nomic-embed-text
      qdrant:
        host: qdrant.base
        grpc-port: 6334
        http-port: 6333
        collection: blog-docs
        dimension: 768
    core:
      enabled: true
      async:
        enabled: true
        core-pool-size: 10
        max-pool-size: 50
        thread-name-prefix: blog-async
    web:
      graceful-response:
        print-exception-in-global-advice: true
        origin-exception-using-detail-message: true
        response-style: 0
        exclude-packages:
          - org.springdoc*
        exclude-paths:
          - /v3/api-docs/**
          - /swagger-ui/**
          - /doc.html
          - /**/music/*/stream
          - /**/ai-chat/chat/stream
          - /**/ai-chat/rag/chat/stream
          - /**/ai-chat/agent/chat/stream
          - /**/ai-chat/selection/ask/stream
      filter:
        version: true
        trace: true
      request:
        enabled: false
        types:
          - LOGGER
      global-exception:
        enabled: true
    security:
      oauth2:
        endpoint:
          uaa-service-uri: ${BLOG_OAUTH2_UAA_URI}
      ignore-url:
        - /actuator/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /doc.html
        - /webjars/**
        - /auth/**
        - /oauth2/**
        - /login/oauth2/**
        - /error
      authentication:
        expire: 86400
    cache:
      redis:
        enabled: true
        cache-manager:
          enabled: true
          type: redis
    data:
      datasource:
        enabled: true
      mybatis:
        mybatis-plus:
          enabled: true
          interceptor:
            enabled: true
            pagination:
              enabled: true
    springdoc:
      enabled: false
      type: SERVICE
      title: Blog API 文档
      description: 博客系统 RESTful API 接口文档
      version: 1.0.0
      packages-to-scan:
        - com.kuma.cloud.blog

    monitor:
      enabled: false
management:
  tracing:
    enabled: true
    sampling:
      probability: ${KUMA_TRACING_SAMPLING:0.1}
  otlp:
    metrics:
      export:
        enabled: false
  server:
    port: ${BLOG_MANAGEMENT_PORT:19001}
    address: ${KUMA_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${KUMA_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${KUMA_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
observability:
  environment: ${KUMA_ENVIRONMENT:local}
  loki-url: ${KUMA_LOKI_URL:http://localhost:3100/loki/api/v1/push}
