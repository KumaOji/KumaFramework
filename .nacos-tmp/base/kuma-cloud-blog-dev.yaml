server:
  port: 9000
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        path: /
  tomcat:
    threads:
      max: 400
      min-spare: 20
    accept-count: 200
    connection-timeout: 20000

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  cloud:
    inetutils:
      timeout-value: 1000
      prefer-ip-address: true
    service-registry:
      auto-registration:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          blog:
            provider: blog-uaa
            client-id: ${BLOG_OAUTH2_CLIENT_ID:blog}
            client-secret: ${BLOG_OAUTH2_CLIENT_SECRET:blog-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9000/api/login/oauth2/code/blog"
            scope:
              - openid
              - profile
              - offline_access
        provider:
          blog-uaa:
            authorization-uri: http://localhost:33336/oauth2/authorize
            token-uri: http://localhost:33336/oauth2/token
            jwk-set-uri: http://localhost:33336/oauth2/jwks
            user-info-uri: http://localhost:33336/userinfo
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:33336/oauth2/jwks
  mvc:
    async:
      request-timeout: 600000
  main:
    lazy-initialization: true
    log-startup-info: true
  cache:
    type: redis
    redis:
      time-to-live: 12h
    cache-names:
      - jwt
  sql:
    init:
      mode: never
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          type: com.zaxxer.hikari.HikariDataSource
          url: jdbc:mysql://172.23.89.45:3306/base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 5
            maximum-pool-size: 30
            connection-timeout: 10000
            idle-timeout: 600000
            max-lifetime: 1800000
  data:
    redis:
      host: 172.23.89.45
      port: 6379
      database: 0
      password: "123456"
      jedis:
        pool:
          max-active: ${redis_jedis_pool_max_active:8}
          max-idle: ${redis_jedis_pool_max_idle:8}
          min-idle: ${redis_jedis_pool_min_idle:0}

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true

blog:
  token-expire-seconds: 604800
  cookie-secure: false
  oauth2:
    registration-id: blog
    username-claim: preferred_username
    issuer-uri: http://localhost:33336
    audience: blog
    login-success-url: http://localhost:3000
    refresh-token-max-age: 30d
  admin-initial-password: admin123
  music:
    base-path: E:\blog-resource\music

jetcache:
  stat-interval-minutes: 15
  local:
    default:
      type: linkedhashmap
      keyConvertor: fastjson2
      limit: 2000

kuma:
  cloud:
    alibaba:
      nacos:
        enabled: true
  boot:
    ai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      model: qwen-turbo
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model: text-embedding-v3
      qdrant:
        host: localhost
        grpc-port: 6334
        http-port: 6333
        collection: blog-docs
        dimension: 1024
      rag:
        chunk-size: 800
        chunk-overlap: 100
    core:
      enabled: true
      async:
        enabled: true
        core-pool-size: 10
        max-pool-size: 50
        thread-name-prefix: blog-async
    web:
      graceful-response:
        print-exception-in-global-advice: true
        origin-exception-using-detail-message: true
        response-style: 0
        exclude-packages:
          - org.springdoc*
        exclude-paths:
          - /v3/api-docs/**
          - /swagger-ui/**
          - /doc.html
          - /**/music/*/stream
          - /**/ai-chat/chat/stream
          - /**/ai-chat/rag/chat/stream
          - /**/ai-chat/agent/chat/stream
          - /**/ai-chat/selection/ask/stream
      filter:
        version: true
        trace: true
      request:
        enabled: true
        types:
          - LOGGER
      global-exception:
        enabled: true
    security:
      oauth2:
        endpoint:
          uaa-service-uri: http://localhost:33336
      ignore-url:
        - /actuator/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /doc.html
        - /webjars/**
        - /auth/**
        - /ws/**
        - /error
      authentication:
        expire: 86400
    cache:
      redis:
        enabled: true
        cache-manager:
          enabled: true
          type: redis
    data:
      datasource:
        enabled: true
      mybatis:
        mybatis-plus:
          enabled: true
          interceptor:
            enabled: true
            pagination:
              enabled: true
    springdoc:
      enabled: true
      type: SERVICE
      title: Blog API 文档
      description: 博客系统 RESTful API 接口文档
      version: 1.0.0
      packages-to-scan:
        - com.kuma.cloud.blog
