# Lab 开发配置（本地无 application.yml，全部从 Nacos 读取）
# MySQL / Redis 与 kuma-shared-dev.yaml 一致，走 WSL 172.23.89.45

server:
  port: 9090
  servlet:
    context-path: /api

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

spring:
  application:
    name: kuma-cloud-lab
  autoconfigure:
    exclude:
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
  cloud:
    inetutils:
      timeout-value: 1000
      prefer-ip-address: true
    service-registry:
      auto-registration:
        enabled: true
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          type: com.zaxxer.hikari.HikariDataSource
          url: jdbc:mysql://172.23.89.45:3306/base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            minimum-idle: 5
            maximum-pool-size: 30
            connection-timeout: 10000
            idle-timeout: 600000
            max-lifetime: 1800000
  data:
    redis:
      host: 172.23.89.45
      port: 6379
      database: 0
      password: "123456"
      jedis:
        pool:
          max-active: ${redis_jedis_pool_max_active:8}
          max-idle: ${redis_jedis_pool_max_idle:8}
          min-idle: ${redis_jedis_pool_min_idle:0}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

kuma:
  cloud:
    alibaba:
      nacos:
        enabled: true
  lab:
    redis:
      key-prefix: "lab:redis:"
    mysql-binlog:
      enabled: false
      jdbc-url: jdbc:mysql://172.23.89.45:3306/base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: 123456
      server-id: 184054
      topic-prefix: kuma-lab-mysql
      table-include-list: base.tx_demo_account
      snapshot-mode: no_data
      offset-file: data/lab-binlog/offsets.dat
      schema-history-file: data/lab-binlog/schema-history.dat
      buffer-capacity: 1000
    kafka:
      enabled: true
      bootstrap-servers: 172.23.89.45:9092
      topic: kuma-lab-test
      group-id: kuma-lab-test-group
      buffer-capacity: 1000
    jni:
      enabled: true
      library-name: "lab_math"
    vector:
      collection: lab-vectors
      dimension: 4
    leetcode:
      enabled: true
    starter:
      key-prefix: "lab:starter:"
      smoke-test-enabled: true
    bloom:
      expected-insertions: 10000
      false-positive-probability: 0.01
    snowflake:
      worker-id: 1
      datacenter-id: 1
      batch-size: 10
    javacore:
      socket-port: 19091
      socket-timeout-millis: 3000
      file-workspace: data/lab-javacore
    spring:
      demo-username: kuma
      demo-order-id: ORD-2026-001
  boot:
    security:
      ignore-url:
        - /lab/**
      oauth2:
        endpoint:
          uaa-service-uri: http://127.0.0.1:33336
    web:
      graceful-response:
        response-style: 0
    data:
      datasource:
        enabled: true
      vector:
        enabled: true
        type: memory
        collection: lab-vectors
        dimension: 4
        distance: COSINE
        auto-create-collection: true
    springdoc:
      enabled: true
      type: SERVICE
      title: Kuma Test Lab API
      description: KumaFramework 测试实验项目接口文档
      version: 1.0.0
      packages-to-scan:
        - com.kuma.cloud.lab
