server:
  port: 18080
  address: 0.0.0.0
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    web-application-type: reactive
  data:
    redis:
      host: redis.base
      port: 6379
      database: 0
      timeout: 3s
  cloud:
    inetutils:
      timeout-value: 1000
      prefer-ip-address: true
    service-registry:
      auto-registration:
        enabled: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
            pool:
              type: elastic
              max-connections: 500
          metrics:
            enabled: true
          observability:
            enabled: true
          default-filters:
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: uaa
              uri: lb://kuma-cloud-uaa
              predicates:
                - Path=/uaa/**
              filters:
                - StripPrefix=1
                # 告知 UAA 外部路径前缀（SCG5 的 XForwarded 过滤器需 trusted-proxies 才激活，这里显式注入更可控）
                - name: AddRequestHeader
                  args:
                    name: X-Forwarded-Prefix
                    value: /uaa
                - name: CircuitBreaker
                  args:
                    name: uaa
                    fallbackUri: forward:/fallback/uaa
            # UAA 独立域名（正式入口）：根路径直达，无需前缀；/uaa/** 路径路由优先于本规则，保持兼容
            - id: uaa-host
              uri: lb://kuma-cloud-uaa
              predicates:
                - Host=uaa.kumacloud.top
              filters:
                - name: CircuitBreaker
                  args:
                    name: uaa
                    fallbackUri: forward:/fallback/uaa
            - id: blog
              uri: lb://kuma-cloud-blog
              predicates:
                - Path=/blog/**
              filters:
                - RewritePath=/blog/(?<segment>.*), /api/${segment}
                - name: CircuitBreaker
                  args:
                    name: blog
                    fallbackUri: forward:/fallback/blog
            - id: blog-api
              uri: lb://kuma-cloud-blog
              predicates:
                - Path=/api/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: blog
                    fallbackUri: forward:/fallback/blog

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      blog:
        base-config: default
        failure-rate-threshold: 80
        minimum-number-of-calls: 20
        wait-duration-in-open-state: 5s
      uaa:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,kmc,kmchealth,kmcstartup,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  health:
    kmc:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true

info:
  app:
    name: gateway
    description: Kuma 体系统一网关
    version: 1.0.0

logging:
  level:
    root: INFO
    com.kuma.cloud.gateway: INFO
    org.springframework.cloud.gateway: INFO

knife4j:
  gateway:
    enabled: false

kuma:
  boot:
    security:
      oauth2:
        endpoint:
          uaa-service-name: kuma-cloud-uaa
    core:
      enabled: true
      env: PRO
      collect-hook-enabled: false
      context-restart-enabled: false
    actuator:
      managedresource:
        enabled: false
    prometheus:
      enabled: true
    monitor:
      enabled: false
    ip2region:
      enabled: false
    logger:
      enabled: true
      logging:
        console:
          enabled: true
          close-after-start: false
        files:
          enabled: false
        logstash:
          enabled: false
        loki:
          enabled: false
  cloud:
    alibaba:
      nacos:
        enabled: true
    gateway:
      enabled: true
      trust-proxy-headers: true
      cors:
        enabled: true
        allowed-origin-patterns:
          - "https://blog.kumacloud.top"
          - "https://*.kumacloud.top"
          # 浏览器顶层表单 POST 导航可能携带 Origin: null（重定向链/隐私策略所致），
          # 这类请求不是真正的跨域 XHR，不应被 CORS 拦截（403）
          - "null"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - PATCH
          - HEAD
        allowed-headers:
          - "*"
        exposed-headers:
          - kmc-trace-id
          - X-Response-Time
          - X-RateLimit-Remaining
          - X-RateLimit-Burst-Capacity
          - X-RateLimit-Replenish-Rate
        allow-credentials: false
        max-age: 1h
      auth:
        enabled: false
        white-list:
          - /actuator/**
          - /fallback/**
          - /uaa/**
          - /oauth2/**
          - /login
          - /logout
          - /captcha
          # uaa.kumacloud.top 独立域名根路径下的公开端点
          - /userinfo
          - /connect/**
          - /doc.html
          - /webjars/**
          - /v3/api-docs/**
          - /favicon.ico
          - /.well-known/**
        authorities-claim: authorities
        username-claim: preferred_username
        relay-identity: true
      access:
        enabled: false
      log:
        enabled: true
        slow-threshold: 2s
        response-time-header: true
      rate-limit:
        fallback-to-ip: true
        include-path: false

actuator:
  db:
    mybatis:
      enhance:
        enable: false
  http:
    enhance:
      enable: false
  redis:
    template:
      enhance:
        enable: false
